<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>蹴鞠 · 齐迹智行</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#080604;color:#d4c5a9;overflow:hidden;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 140% 50% at 50% -10%,rgba(139,115,85,.1) 0%,transparent 60%),radial-gradient(ellipse 80% 60% at 20% 80%,rgba(74,139,122,.05) 0%,transparent 50%);pointer-events:none;z-index:0}

/* ===== Minimal overlay header ===== */
.overlay-header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(.6rem + env(safe-area-inset-top,0px)) 1rem .6rem;background:linear-gradient(180deg,rgba(8,6,4,.85) 0%,transparent 100%)}
.overlay-header .brand{display:flex;align-items:center;gap:.4rem}
.overlay-header .brand .ic{font-size:1.1rem}
.overlay-header .brand .name{font-size:.7rem;color:#6a5a40;letter-spacing:3px;font-weight:600}
.overlay-header .score{background:rgba(20,16,12,.8);border:1px solid rgba(205,127,50,.12);border-radius:8px;padding:.25rem .6rem;font-size:.75rem;color:#8a7a60;font-weight:600;backdrop-filter:blur(4px)}
.overlay-header .score b{font-size:1.1rem;color:#d4c5a9}

/* ===== Full-screen canvas ===== */
.wrap{position:fixed;inset:0;z-index:1}
canvas{display:block;width:100%;height:100%}

/* ===== Bottom tip ===== */
.tip{position:fixed;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(20,16,12,.85);border:1px solid rgba(205,127,50,.1);border-radius:20px;padding:.4rem 1.2rem;font-size:.78rem;color:#6a5a40;z-index:10;pointer-events:none;letter-spacing:2px;white-space:nowrap;backdrop-filter:blur(4px)}

/* ===== Back button ===== */
.back{position:fixed;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));left:1rem;color:#4a3a28;text-decoration:none;font-size:.65rem;background:rgba(20,16,12,.85);border:1px solid rgba(74,58,40,.12);padding:.35rem .8rem;border-radius:20px;z-index:10;transition:all .3s ease;backdrop-filter:blur(4px)}
.back:active{color:#cd7f32;border-color:rgba(205,127,50,.15)}

/* ===== Popup ===== */
.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(165deg,rgba(20,16,12,.96),rgba(12,10,8,.98));border:1px solid rgba(205,127,50,.15);border-radius:20px;padding:1.8rem 2rem;text-align:center;z-index:50;transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 24px 64px rgba(0,0,0,.6);max-width:88%;backdrop-filter:blur(12px)}
.popup.show{transform:translate(-50%,-50%) scale(1)}
.popup .big{font-size:2.6rem;margin-bottom:.3rem}
.popup h2{font-size:1.2rem;color:#d4c5a9;letter-spacing:3px;margin-bottom:.5rem}
.popup p{font-size:.8rem;color:#6a5a40;line-height:1.7}
.popup button{margin-top:1rem;background:linear-gradient(135deg,rgba(205,127,50,.12),rgba(120,70,25,.06));color:#d4c5a9;border:1px solid rgba(205,127,50,.2);padding:.5rem 1.6rem;border-radius:12px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .3s ease}
.popup button:active{transform:scale(.97);border-color:rgba(205,127,50,.35)}
</style>
</head>
<body>
<header>
  <h1>蹴鞠 · 鞠场</h1>
  <p>一鞠过眼 · 齐风千载</p>
</header>
<div class="score">过眼 <b id="score">0</b></div>
<div class="wrap"><canvas id="field"></canvas></div>
<div class="tip">👆 点击踢出蹴鞠</div>
<a class="back" href="../">← 返回主页</a>
<div id="popup" class="popup">
  <div class="big">⚽</div>
  <h2 id="popTitle">好鞠！</h2>
  <p id="popMsg">蹴鞠起源于战国时期的齐国临淄，是足球的前身！</p>
  <button onclick="this.parentNode.classList.remove('show')">再来一鞠</button>
</div>
<script src="../libs/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('field');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  var scene = new THREE.Scene();
  var SKY = 0xcbb88f;
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 45, 110);

  var manager = new THREE.LoadingManager();
  function tex(src, rx, ry) {
    var t = new THREE.TextureLoader(manager).load(src);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx || 1, ry || 1);
    t.anisotropy = 4;
    return t;
  }
  function mat(map, opts) {
    return new THREE.MeshStandardMaterial(Object.assign({ map: map, roughness: 0.95, metalness: 0.03 }, opts || {}));
  }
  var groundTex = tex('assets/ground.jpg', 14, 10);
  var wallTex = tex('assets/wall.jpg', 10, 1);
  var woodTex = tex('assets/wood.jpg', 1, 1);
  var groundMat = mat(groundTex);
  var wallMat = mat(wallTex);
  var woodMat = mat(woodTex, { roughness: 0.85 });
  var darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x4a3120, roughness: 0.9 });
  var roofMat = new THREE.MeshStandardMaterial({ color: 0x3f4a4d, roughness: 0.9 });   // 青瓦
  var gateRoofMat = new THREE.MeshStandardMaterial({ color: 0x2e6b4f, roughness: 0.85 }); // 绿瓦
  var redFrameMat = new THREE.MeshStandardMaterial({ color: 0x8c3a2a, roughness: 0.7 });  // 朱漆木
  var ballMat = new THREE.MeshStandardMaterial({ color: 0x7a4a22, roughness: 0.6, metalness: 0.05 });
  var trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d24, roughness: 0.95 });
  var leafMat = new THREE.MeshStandardMaterial({ color: 0x3f6b33, roughness: 0.9 });

  function add(m) { scene.add(m); return m; }
  function box(w, h, d, x, y, z, m) {
    var mm = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    mm.position.set(x, y, z);
    return add(mm);
  }
  function cyl(rT, rB, h, x, y, z, m, seg) {
    var mm = new THREE.Mesh(new THREE.CylinderGeometry(rT, rB, h, seg || 12), m);
    mm.position.set(x, y, z);
    return add(mm);
  }
  function gableGeo(span, rise, len) {
    var shape = new THREE.Shape();
    shape.moveTo(-span / 2, 0); shape.lineTo(span / 2, 0); shape.lineTo(0, rise); shape.closePath();
    var geo = new THREE.ExtrudeGeometry(shape, { depth: len, bevelEnabled: false });
    geo.translate(0, 0, -len / 2);
    return geo;
  }
  function gable(w, h, d, x, y, z, m, rotY) {
    var mm = new THREE.Mesh(gableGeo(w, h, d), m || roofMat);
    mm.position.set(x, y, z);
    if (rotY) mm.rotation.y = rotY;
    return add(mm);
  }

  // ---------- 光照 ----------
  // r160 物理光照单位：强度需比旧版 legacy 模式高约 π 倍
  scene.add(new THREE.HemisphereLight(0xfff2dc, 0x5a4630, 3.0));
  var sun = new THREE.DirectionalLight(0xfff0d0, 3.5);
  sun.position.set(30, 50, 20);
  scene.add(sun);

  // ---------- 大地与鞠场 ----------
  var earth = new THREE.Mesh(new THREE.PlaneGeometry(90, 64), mat(tex('assets/ground.jpg', 22, 15)));
  earth.rotation.x = -Math.PI / 2;
  add(earth);
  // 鞠场（稍高的夯土台地）
  box(20, 0.16, 12.5, 0, 0.06, 0, groundMat);

  // ---------- 风流眼（鞠门） ----------
  var EYE_Y = 2.15, EYE_Z = -7, HALF = 1.65;
  // 两侧立柱
  cyl(0.13, 0.15, 3.6, -HALF, 1.8, EYE_Z, woodMat);
  cyl(0.13, 0.15, 3.6, HALF, 1.8, EYE_Z, woodMat);
  // 横梁
  box(3.8, 0.2, 0.2, 0, 3.62, EYE_Z, darkWoodMat);
  // 圆形风流眼（朱漆木圈）
  var ring = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.055, 12, 48), redFrameMat);
  ring.position.set(0, EYE_Y, EYE_Z);
  add(ring);
  // 兜网（以风流眼为中心的环形网）
  var net = new THREE.Mesh(
    new THREE.RingGeometry(0.62, 1.55, 40, 4),
    new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.28 })
  );
  net.position.set(0, EYE_Y, EYE_Z);
  add(net);
  // 两根斜撑
  function strut(x1, y1, z1, x2, y2, z2) {
    var dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
    var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
    var s = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, len, 8), darkWoodMat);
    s.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    s.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(dx, dy, dz).normalize());
    add(s);
  }
  strut(-HALF, 1.4, EYE_Z, -0.35, EYE_Y, EYE_Z);
  strut(HALF, 1.4, EYE_Z, 0.35, EYE_Y, EYE_Z);

  // ---------- 背景宫墙与城楼 ----------
  function wallSegment(x, z) {
    box(22, 3.2, 0.8, x, 1.6, z, wallMat);
    for (var i = -5; i <= 5; i++) {
      if (Math.abs(i * 2) < 3.5) continue; // 中间留口给城楼
      box(1.1, 0.7, 1.1, x + i * 2, 3.2 + 0.35, z, wallMat);
    }
  }
  wallSegment(-16.5, -13.5); wallSegment(16.5, -13.5);
  // 中央城楼（门阙式）
  box(6.5, 4.6, 3.2, 0, 2.3, -13.5, wallMat);
  box(7.2, 0.5, 3.8, 0, 4.85, -13.5, wallMat);
  gable(8.2, 2.0, 4.8, 0, 5.6, -13.5, gateRoofMat);
  // 两侧望楼
  [[-24.5, -12.5], [24.5, -12.5]].forEach(function (p) {
    box(2.6, 4.4, 2.6, p[0], 2.2, p[1], wallMat);
    var tw = new THREE.Mesh(new THREE.ConeGeometry(2.1, 1.3, 4), roofMat);
    tw.position.set(p[0], 4.4 + 0.65, p[1]);
    tw.rotation.y = Math.PI / 4;
    add(tw);
  });
  // 远处宫殿剪影（左后方）
  box(9, 2.2, 5, -13, 1.1, -11.5, new THREE.MeshStandardMaterial({ color: 0x6a3a2a, roughness: 0.9 }));
  gable(11, 2.2, 7, -13, 3.3, -11.5, gateRoofMat);

  // ---------- 树木（多层球冠，不用锥体） ----------
  function tree(x, z, s) {
    var sc = s || 1;
    cyl(0.16 * sc, 0.24 * sc, 2.8 * sc, x, 1.4 * sc, z, trunkMat, 8);
    var fo = new THREE.Group();
    var c1 = new THREE.Mesh(new THREE.SphereGeometry(1.15 * sc, 12, 9), leafMat);
    c1.position.set(0, 2.8 * sc, 0);
    var c2 = new THREE.Mesh(new THREE.SphereGeometry(0.9 * sc, 12, 9), leafMat);
    c2.position.set(0.65 * sc, 2.2 * sc, 0.25 * sc);
    var c3 = new THREE.Mesh(new THREE.SphereGeometry(0.85 * sc, 12, 9), leafMat);
    c3.position.set(-0.6 * sc, 2.1 * sc, -0.2 * sc);
    fo.add(c1, c2, c3);
    fo.position.set(x, 0, z);  // 球冠已在组内带 y 偏移，组本身不再抬高，避免树叶悬空
    add(fo);
  }
  tree(-11.5, -4, 1.25);
  tree(11.5, -4, 1.1);
  tree(-12.5, 5, 0.9);
  tree(12.5, 5, 1.0);
  tree(-6, -10.5, 0.8);
  tree(6, -10.5, 0.85);

  // ---------- 蹴鞠（压扁皮球 + 缝线） ----------
  var ball = new THREE.Group();
  var core = new THREE.Mesh(new THREE.SphereGeometry(0.34, 26, 20), ballMat);
  core.scale.y = 0.72;
  var seams = new THREE.Mesh(
    new THREE.SphereGeometry(0.342, 26, 20),
    new THREE.MeshBasicMaterial({ color: 0x2a1a0c, wireframe: true, transparent: true, opacity: 0.4 })
  );
  seams.scale.y = 0.72;
  ball.add(core, seams);
  var START = new THREE.Vector3(0, 0.42, 4.2);
  ball.position.copy(START);
  scene.add(ball);

  // ---------- 相机 ----------
  var camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
  camera.position.set(0, 3.6, 9.5);
  camera.lookAt(0, 1.8, -6);

  // ---------- 射门交互 ----------
  var score = 0, scoreEl = document.getElementById('score');
  var popup = document.getElementById('popup');
  var popTitle = document.getElementById('popTitle');
  var popMsg = document.getElementById('popMsg');
  var state = 'idle';           // idle | flying | falling
  var shot = null;

  function showPopup(ok) {
    if (ok) {
      score++; scoreEl.textContent = score;
      popTitle.textContent = '好鞠！过了风流眼！';
      popMsg.innerHTML = '蹴鞠起源于战国时期的<b>齐国临淄</b>，唐宋时传入宫廷成为「筑球」，被公认为足球的前身。';
    } else {
      popTitle.textContent = '差一点！';
      popMsg.textContent = '球没进风流眼，再来一鞠！';
    }
    popup.classList.add('show');
  }

  canvas.addEventListener('click', function () {
    if (state !== 'idle') return;
    var tx = (Math.random() - 0.5) * 1.5;   // 瞄向风流眼中心 ± 0.75
    var ty = EYE_Y + (Math.random() - 0.5) * 0.7;
    shot = {
      sx: ball.position.x, sy: ball.position.y, sz: ball.position.z,
      tx: tx, ty: ty, tz: EYE_Z - 0.55,
      t: 0, dur: 0.85,
      hit: Math.abs(tx) < 0.48 && Math.abs(ty - EYE_Y) < 0.42
    };
    state = 'flying';
  });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (state === 'idle') canvas.dispatchEvent(new MouseEvent('click'));
  }, { passive: false });

  // ---------- 动画循环 ----------
  function resize() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // 竖屏时拉远并抬高相机，让鞠门与场景完整入镜
    if (w < h) {
      camera.position.set(0, 4.2, 12.5);
      camera.lookAt(0, 2.0, -6.5);
    } else {
      camera.position.set(0, 3.6, 9.5);
      camera.lookAt(0, 1.8, -6);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  var last = performance.now();
  (function anim(now) {
    requestAnimationFrame(anim);
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (state === 'flying' && shot) {
      shot.t += dt / shot.dur;
      var p = Math.min(1, shot.t);
      var arc = 1.9 * 4 * p * (1 - p);
      ball.position.set(
        shot.sx + (shot.tx - shot.sx) * p,
        shot.sy + (shot.ty - shot.sy) * p + arc,
        shot.sz + (shot.tz - shot.sz) * p
      );
      ball.rotation.x += dt * 6;
      ball.rotation.z += dt * 2.5;
      if (p >= 1) {
        state = 'falling';
        showPopup(shot.hit);
        setTimeout(function () {
          if (state === 'falling') state = 'reset';
        }, 900);
      }
    } else if (state === 'falling') {
      ball.position.y = Math.max(0.42, ball.position.y - dt * 4);
    } else if (state === 'reset') {
      ball.position.set(START.x, START.y, START.z);
      ball.rotation.set(0, 0, 0);
      state = 'idle';
    } else {
      ball.rotation.y += dt * 0.8;
    }

    renderer.render(scene, camera);
  })(performance.now());
})();
</script>
</body>
</html>
