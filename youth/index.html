<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>青春传承 · 电子证书</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#1a1209;color:#f0e6d3;min-height:100vh;background-image:radial-gradient(ellipse at 30% 20%,#3d2b1a 0%,#1a1209 70%);padding:1rem}
.container{max-width:560px;margin:0 auto}
header{text-align:center;padding:1.5rem 1rem 1rem}
header h1{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,#e8c97a,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px}
header p{font-size:.85rem;color:#b8a080;margin-top:.4rem;letter-spacing:2px}
.form{background:linear-gradient(145deg,#2a1f12,#1e160c);border:1px solid #4a3820;border-radius:12px;padding:1.2rem;margin:1rem 0}
.form label{display:block;font-size:.8rem;color:#c4a970;margin-bottom:.4rem;letter-spacing:1px}
.form input,.form select{width:100%;padding:.7rem .8rem;background:#1a1209;border:1px solid #4a3820;border-radius:8px;color:#f0e6d3;font-size:.95rem;font-family:inherit;margin-bottom:1rem}
.form input:focus,.form select:focus{outline:none;border-color:#b8860b}
.btn{display:block;width:100%;padding:.9rem;background:linear-gradient(135deg,#b8860b,#8a6509);color:#1a1209;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:3px}
.btn:hover{background:linear-gradient(135deg,#d4a02b,#a88519)}
.btn.ghost{background:transparent;border:1px solid #b8860b;color:#e8c97a;margin-top:.8rem}
.btn.ghost:hover{background:rgba(184,134,11,.1)}
/* 证书 */
.cert-wrap{margin:1rem 0}
.cert{position:relative;background:#f6ecd9;color:#4a3520;border-radius:4px;padding:2rem 1.5rem;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:2px solid #c9a227;pointer-events:none}
.cert::after{content:"";position:absolute;inset:16px;border:1px solid #c9a227;pointer-events:none}
.cert .emblem{font-size:2.4rem;line-height:1}
.cert .cert-title{font-size:1.8rem;font-weight:800;color:#a97c1a;letter-spacing:10px;margin:.8rem 0;font-family:"STKaiti","KaiTi","SimSun",serif}
.cert .cert-sub{font-size:.85rem;color:#8a6a3a;letter-spacing:3px;margin-bottom:1rem}
.cert .name{font-size:1.9rem;font-weight:700;color:#6b4423;letter-spacing:2px;margin:.8rem 0;font-family:"STKaiti","KaiTi","SimSun",serif}
.cert .line{font-size:.95rem;color:#5a4a30;line-height:1.9}
.cert .honor{font-size:1.15rem;color:#a97c1a;font-weight:700;letter-spacing:3px;margin:.8rem 0}
.cert .org{font-size:.85rem;color:#8a6a3a;margin-top:1rem;letter-spacing:1px}
.cert .date{font-size:.78rem;color:#8a6a3a;margin-top:.5rem}
.cert .qr{position:absolute;bottom:1.2rem;right:1.5rem;width:64px;height:64px;background:#fff;border-radius:4px;overflow:hidden}
.cert .qr img,.cert .qr canvas{width:64px;height:64px;display:block}
.cert .seal{position:absolute;bottom:1.6rem;left:2rem;width:74px;height:74px;border:3px solid #c0392b;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);color:#c0392b;font-weight:700;font-size:.72rem;line-height:1.3;text-align:center;opacity:.85}
footer{text-align:center;padding:1.5rem 1rem;font-size:.7rem;color:#6a5a40;line-height:1.6;border-top:1px solid #2a1f12;margin-top:1rem}
.back{display:block;text-align:center;margin:1rem auto;color:#b8860b;text-decoration:none;font-size:.85rem;border:1px solid #b8860b;padding:.5rem 1.5rem;border-radius:6px;width:fit-content}
</style>
</head>
<body>
<div class="container">
<header>
<h1>青春传承</h1>
<p>领取你的齐文化传承使者电子证书</p>
</header>
<div class="form">
  <label>你的姓名</label>
  <input id="name" type="text" placeholder="请输入姓名，如：张同学">
  <label>所属团队 / 高校</label>
  <select id="org">
    <option>齐迹智行实践团 · 山东理工大学</option>
    <option>山东理工大学</option>
    <option>其他高校</option>
  </select>
  <button class="btn" onclick="generate()">生成证书</button>
</div>
<div class="cert-wrap" id="certWrap" style="display:none">
  <div class="cert" id="cert">
    <div class="emblem">🏅</div>
    <div class="cert-title">荣誉证书</div>
    <div class="cert-sub">—— 齐文化传承 · 数字赋能实践 ——</div>
    <div class="line">兹授予</div>
    <div class="name" id="certName">同学</div>
    <div class="line">在「数字赋能齐文脉，青春传承齐风骨」<br>暑期社会实践活动中表现优异，特授予</div>
    <div class="honor">『齐文化传承使者』称号</div>
    <div class="line">特发此证，以资鼓励</div>
    <div class="org" id="certOrg">齐迹智行实践团 · 山东理工大学</div>
    <div class="date" id="certDate"></div>
    <div class="seal">齐迹智行<br>实践团</div>
    <div class="qr" id="certQr"></div>
  </div>
  <button class="btn ghost" id="saveBtn" onclick="saveCert()">📥 保存到相册</button>
</div>
<a class="back" href="../">← 返回主页</a>
<footer>
  齐迹智行实践团 · 数字赋能齐文脉，青春传承齐风骨 · 2026 暑假社会实践
</footer>
</div>
<script src="../libs/qrcode.min.js"></script>
<script src="../libs/html2canvas.min.js"></script>
<script>
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function generate() {
  var name = document.getElementById('name').value.trim();
  if (!name) { alert('请先输入姓名'); return; }
  var org = document.getElementById('org').value;
  var d = new Date();
  document.getElementById('certName').textContent = name;
  document.getElementById('certOrg').textContent = org;
  document.getElementById('certDate').textContent = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  var qrBox = document.getElementById('certQr');
  qrBox.innerHTML = '';
  var url = location.origin + location.pathname.replace(/\/[^/]*$/, "") + "/";
  try {
    new QRCode(qrBox, { text: url, width: 64, height: 64, colorDark: "#1a1209", colorLight: "#ffffff" });
  } catch (e) {
    qrBox.innerHTML = '<span style="font-size:10px;color:#999">QR</span>';
  }
  document.getElementById('certWrap').style.display = 'block';
  document.getElementById('certWrap').scrollIntoView({ behavior: 'smooth' });
}
function saveCert() {
  var btn = document.getElementById('saveBtn');
  btn.textContent = '生成中…';
  btn.disabled = true;
  html2canvas(document.getElementById('cert'), { backgroundColor: '#f6ecd9', scale: 2 }).then(function (canvas) {
    var link = document.createElement('a');
    link.download = '齐迹智行_传承使者证书.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.textContent = '📥 保存到相册';
    btn.disabled = false;
  }).catch(function () {
    alert('保存失败，请长按证书图片截图保存');
    btn.textContent = '📥 保存到相册';
    btn.disabled = false;
  });
}
</script>
</body>
</html>
