<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>青春传承 · 电子证书</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#080604;color:#d4c5a9;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 140% 50% at 50% -10%,rgba(139,115,85,.1) 0%,transparent 60%),radial-gradient(ellipse 80% 60% at 20% 80%,rgba(74,139,122,.05) 0%,transparent 50%);pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:0 1rem 1rem;min-height:100dvh;display:flex;flex-direction:column}

/* ===== Hero ===== */
.hero{text-align:center;padding:calc(2rem + env(safe-area-inset-top,0px)) .5rem 1rem;flex-shrink:0}
.hero .emblem{font-size:2.6rem;display:block;margin-bottom:.2rem;filter:drop-shadow(0 0 30px rgba(205,127,50,.15));animation:floatEmblem 4s ease-in-out infinite}
@keyframes floatEmblem{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hero h1{font-size:1.5rem;font-weight:800;color:#d4c5a9;letter-spacing:8px;text-shadow:0 0 30px rgba(205,127,50,.1)}
.hero .sub{font-size:.6rem;color:#4a3a28;margin-top:.4rem;letter-spacing:2px;border:1px solid rgba(74,58,40,.12);display:inline-block;padding:.1rem .7rem;border-radius:10px}

/* ===== Form ===== */
.form{background:linear-gradient(165deg,rgba(20,16,12,.85),rgba(12,10,8,.92));border:1px solid rgba(74,58,40,.15);border-radius:16px;padding:1.2rem;margin:.5rem 0;flex-shrink:0}
.form label{display:block;font-size:.7rem;color:#4a3a28;margin-bottom:.25rem;letter-spacing:1px}
.form input,.form select{width:100%;padding:.7rem .8rem;background:rgba(12,10,8,.6);border:1px solid rgba(74,58,40(.15);border-radius:10px;color:#d4c5a9;font-size:16px;font-family:inherit;margin-bottom:.8rem;transition:border-color .3s ease}
.form input:focus,.form select:focus{outline:none;border-color:rgba(205,127,50(.25)}
.btn{display:block;width:100%;padding:.85rem;background:linear-gradient(135deg,rgba(205,127,50(.12),rgba(120,70,25,.06));color:#d4c5a9;border:1px solid rgba(205,127,50(.2);border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:3px;min-height:50px;transition:all .3s ease}
.btn:active{transform:scale(.97);border-color:rgba(205,127,50(.35)}

/* ===== Certificate ===== */
.cert-wrap{margin:.8rem 0;flex:1;display:flex;flex-direction:column;justify-content:center}
.cert{position:relative;background:linear-gradient(165deg,#f0e6d3,#e8dcc8);color:#4a3520;border-radius:4px;padding:2rem 1.5rem;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.5),0 0 0 1px rgba(205,127,50(.06);overflow:hidden}
.cert::before{content:'';position:absolute;inset:10px;border:2px solid rgba(201,162,39,.35);pointer-events:none}
.cert::after{content:'';position:absolute;inset:16px;border:1px solid rgba(201,162,39(.15);pointer-events:none}
.cert .emblem{font-size:2.4rem;line-height:1}
.cert .cert-title{font-size:1.8rem;font-weight:800;color:#a97c1a;letter-spacing:10px;margin:.8rem 0;font-family:'STKaiti','KaiTi','SimSun',serif}
.cert .cert-sub{font-size:.75rem;color:#8a6a3a;letter-spacing:3px;margin-bottom:1rem}
.cert .name{font-size:1.9rem;font-weight:700;color:#6b4423;letter-spacing:2px;margin:.8rem 0;font-family:'STKaiti','KaiTi','SimSun',serif}
.cert .line{font-size:.85rem;color:#5a4a30;line-height:1.9}
.cert .honor{font-size:1.1rem;color:#a97c1a;font-weight:700;letter-spacing:3px;margin:.8rem 0}
.cert .org{font-size:.75rem;color:#8a6a3a;margin-top:1rem;letter-spacing:1px}
.cert .date{font-size:.68rem;color:#8a6a3a;margin-top:.5rem}
.cert .qr{position:absolute;bottom:1.2rem;right:1.5rem;width:64px;height:64px;background:#fff;border-radius:4px;overflow:hidden}
.cert .qr img,.cert .qr canvas{width:64px;height:64px;display:block}
.cert .seal{position:absolute;bottom:1.6rem;left:2rem;width:74px;height:74px;border:3px solid rgba(192,57,43,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);color:rgba(192,57,43,.5);font-weight:700;font-size:.65rem;line-height:1.3;text-align:center}
.btn-ghost{display:block;width:100%;margin-top:.8rem;padding:.7rem;background:transparent;color:#6a5a40;border:1px solid rgba(74,58,40(.15);border-radius:12px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:2px;transition:all .3s ease;min-height:48px}
.btn-ghost:active{border-color:rgba(205,127,50(.25);color:#cd7f32}

/* ===== Footer & Back ===== */
footer{text-align:center;padding:1rem .5rem calc(.5rem + env(safe-area-inset-bottom,0px));font-size:.55rem;color:#2a1a10;line-height:1.6;flex-shrink:0}
.back{display:block;text-align:center;margin:.5rem auto;color:#4a3a28;text-decoration:none;font-size:.7rem;border:1px solid rgba(74,58,40(.15);padding:.3rem 1.2rem;border-radius:20px;width:fit-content;transition:all .3s ease;flex-shrink:0}
.back:active{color:#cd7f32;border-color:rgba(205,127,50(.2);background:rgba(20,16,12,.9)}
@media(max-width:420px){.cert{padding:1.6rem 1rem 5rem}.cert .cert-title{font-size:1.4rem;letter-spacing:5px}.cert .name{font-size:1.5rem}.cert .honor{font-size:1rem;letter-spacing:2px}.cert .line{font-size:.82rem}.cert .seal{width:58px;height:58px;bottom:1rem;left:.8rem;font-size:.58rem}.cert .qr{width:52px;height:52px;bottom:1rem;right:.8rem}.cert .qr img,.cert .qr canvas{width:52px;height:52px}}
</style>
</head>
<body>
<div class="page">
<div class="hero">
  <span class="emblem">🏅</span>
  <h1>青春传承</h1>
  <div class="sub">领取你的齐文化传承使者电子证书</div>
</div>
<div class="form">
  <label>你的姓名</label>
  <input id="name" type="text" placeholder="请输入姓名，如：张同学">
  <label>所属团队 / 高校</label>
  <select id="org">
    <option>齐迹智行实践团 · 山东理工大学</option>
    <option>山东理工大学</option>
    <option>其他高校</option>
  </select>
  <button class="btn" onclick="generate()">生成证书</button>
</div>
<div class="cert-wrap" id="certWrap" style="display:none">
  <div class="cert" id="cert">
    <div class="emblem">🏅</div>
    <div class="cert-title">荣誉证书</div>
    <div class="cert-sub">—— 齐文化传承 · 数字赋能实践 ——</div>
    <div class="line">兹授予</div>
    <div class="name" id="certName">同学</div>
    <div class="line">在「数字赋能齐文脉，青春传承齐风骨」<br>暑期社会实践活动中表现优异，特授予</div>
    <div class="honor">『齐文化传承使者』称号</div>
    <div class="line">特发此证，以资鼓励</div>
    <div class="org" id="certOrg">齐迹智行实践团 · 山东理工大学</div>
    <div class="date" id="certDate"></div>
    <div class="seal">齐迹智行<br>实践团</div>
    <div class="qr" id="certQr"></div>
  </div>
  <button class="btn-ghost" id="saveBtn" onclick="saveCert()">📥 保存到相册</button>
</div>
<a class="back" href="../">← 返回主页</a>
<footer>齐迹智行实践团 · 山东理工大学 · 2026 暑假社会实践</footer>
</div>
<script src="../libs/qrcode.min.js"></script>
<script src="../libs/html2canvas.min.js"></script>
<script>
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function generate() {
  var name = document.getElementById('name').value.trim();
  if (!name) { alert('请先输入姓名'); return; }
  var org = document.getElementById('org').value;
  var d = new Date();
  document.getElementById('certName').textContent = name;
  document.getElementById('certOrg').textContent = org;
  document.getElementById('certDate').textContent = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  var qrBox = document.getElementById('certQr');
  qrBox.innerHTML = '';
  var url = location.origin + location.pathname.replace(/\/[^/]*$/, "") + "/";
  try { new QRCode(qrBox, { text: url, width: 64, height: 64, colorDark: "#1a1209", colorLight: "#ffffff" }); }
  catch (e) { qrBox.innerHTML = '<span style="font-size:10px;color:#999">QR</span>'; }
  document.getElementById('certWrap').style.display = 'flex';
  document.getElementById('certWrap').scrollIntoView({ behavior: 'smooth' });
}
function saveCert() {
  var btn = document.getElementById('saveBtn');
  btn.textContent = '生成中…'; btn.disabled = true;
  html2canvas(document.getElementById('cert'), { backgroundColor: '#f6ecd9', scale: 2 }).then(function (canvas) {
    var link = document.createElement('a');
    link.download = '齐迹智行_传承使者证书.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.textContent = '📥 保存到相册'; btn.disabled = false;
  }).catch(function () {
    alert('保存失败，请长按证书图片截图保存');
    btn.textContent = '📥 保存到相册'; btn.disabled = false;
  });
}
</script>
</body>
</html>
