<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>AR 青铜鼎 · 齐迹智行</title>
<script src="https://cdn.jsdelivr.net/gh/2192735223/qijizhixing@master/libs/aframe.min.js" onerror="window.__aframeLoadFailed=1"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js" onerror="window.__arjsLoadFailed=1"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#1a1209;color:#f0e6d3;overflow:hidden}
.hint{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:rgba(42,31,18,.9);padding:.6rem 1.2rem;border-radius:8px;font-size:.85rem;color:#c4a970;z-index:100;text-align:center;border:1px solid #b8860b;max-width:90%}
.print-btn{position:fixed;top:1rem;right:1rem;background:#b8860b;color:#1a1209;border:none;padding:.5rem 1rem;border-radius:6px;font-weight:600;cursor:pointer;z-index:100;font-size:.85rem}
.print-btn:hover{background:#e8c97a}
.status{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:rgba(42,31,18,.92);border:1px solid #b8860b;border-radius:8px;padding:.55rem 1.1rem;font-size:.8rem;color:#c4a970;z-index:100;text-align:center;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,18,9,.93);z-index:300}
.loading .spin{width:44px;height:44px;border:4px solid #4a3820;border-top-color:#b8860b;border-radius:50%;animation:rot 1s linear infinite}
.loading p{color:#c4a970;font-size:.9rem;margin-top:1rem;letter-spacing:2px}
@keyframes rot{to{transform:rotate(360deg)}}
.marker-page{display:none;position:fixed;inset:0;background:#f0e6d3;color:#1a1209;padding:2rem;z-index:400;overflow:auto}
.marker-page.show{display:block}
.marker-page h2{color:#1a1209;text-align:center;margin-bottom:1rem}
.marker-page svg{display:block;margin:1rem auto;max-width:90vw;border:2px solid #1a1209}
.marker-page .tip{color:#6a5035;font-size:.85rem;text-align:center;margin-top:1rem;line-height:1.8}
.marker-page .close{position:fixed;top:1rem;right:1rem;background:#1a1209;color:#f0e6d3;border:none;padding:.5rem 1rem;border-radius:6px;cursor:pointer}
.fallback{position:fixed;inset:0;display:none;background:#1a1209;z-index:200}
.fallback.show{display:flex;flex-direction:column;align-items:center;justify-content:center}
.fallback canvas{width:90vw;height:60vh;border-radius:8px;display:block}
.fallback p{margin-top:1rem;color:#b8a080;font-size:.85rem;text-align:center;padding:0 1rem}
.back{position:fixed;bottom:1rem;left:1rem;color:#c4a970;text-decoration:none;font-size:.8rem;background:rgba(42,31,18,.9);border:1px solid #4a3820;padding:.4rem .9rem;border-radius:6px;z-index:100}
</style>
</head>
<body>
<div class="hint">📷 将摄像头对准下方的 Hiro 标识卡 <span style="opacity:.55;font-size:.75em">· v2</span></div>
<button class="print-btn" onclick="document.getElementById('mp').classList.add('show')">🖨️ 打印 Hiro 标识</button>
<div id="status" class="status">正在启动…</div>



<div id="fallback" class="fallback">
  <canvas id="view3d"></canvas>
  <p id="fbMsg">3D 预览模式 · 鼠标 / 手指拖拽旋转</p>
</div>

<div id="mp" class="marker-page">
  <button class="close" onclick="document.getElementById('mp').classList.remove('show')">关闭</button>
  <h2>Hiro 标识 · 打印后对准摄像头即可体验 AR</h2>
  <img src="../data/markers/hiro_border_p0.png" alt="Hiro 标识" style="width:min(78vw,340px);height:auto;border:2px solid #1a1209">
  <div class="tip">
    打印方法：右键点击上方标识图片 → 「图片另存为」→ 用图片查看器打印（建议 A4，标识宽度约 8—10 厘米）<br>
    摆放：将标识平放在桌面，摄像头从上方约 30 cm 距离对准<br>
    注意：首次使用请在浏览器地址栏允许摄像头权限；手机需用 localhost 或 https 访问
  </div>
</div>

<a class="back" href="../">← 返回主页</a>

<div id="loading" class="loading"><div class="spin"></div><p>正在加载青铜鼎模型…</p></div>

<script>
(function () {
  var THREE = (window.AFRAME && AFRAME.THREE) || window.THREE;
  var loadingEl = document.getElementById('loading');
  var statusEl = document.getElementById('status');
  function setStatus(t) { statusEl.textContent = t; }

  // ---------- OBJ 解析（v / vt / f） ----------
  function parseOBJ(text) {
    var pos = [], uv = [], faces = [];
    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i].trim();
      if (!l) continue;
      var c = l[0];
      if (c === 'v') {
        var p = l.split(/\s+/);
        if (p[0] === 'v') pos.push(+p[1], +p[2], +p[3]);
        else if (p[0] === 'vt') uv.push(+p[1], +p[2]);
      } else if (c === 'f') {
        var parts = l.split(/\s+/), ids = [];
        for (var j = 1; j < parts.length; j++) {
          ids.push(parseInt(parts[j].split('/')[0], 10) - 1);
        }
        for (var j2 = 1; j2 < ids.length - 1; j2++) {
          faces.push(ids[0], ids[j2], ids[j2 + 1]);
        }
      }
    }
    return { pos: pos, uv: uv, faces: faces };
  }

  function buildGeometry(data) {
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(data.pos), 3));
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(data.uv), 2));
    if (data.faces.length < 65536) {
      g.setIndex(new THREE.BufferAttribute(new Uint16Array(data.faces), 1));
    } else {
      g.setIndex(new THREE.BufferAttribute(new Uint32Array(data.faces), 1));
    }
    g.computeVertexNormals();
    return g;
  }

  function bronzeMaterial(cb) {
    var tex = new THREE.TextureLoader().load('https://cdn.jsdelivr.net/gh/2192735223/qijizhixing@master/ar-bronze/assets/ding_diffuse.jpg', function () {
      cb(new THREE.MeshStandardMaterial({ map: tex, metalness: 0.3, roughness: 0.55 }));
    }, undefined, function () {
      cb(new THREE.MeshStandardMaterial({ color: 0x6b4423, metalness: 0.6, roughness: 0.4 }));
    });
    return tex;
  }

  function fetchModel(cb) {
    fetch('https://cdn.jsdelivr.net/gh/2192735223/qijizhixing@master/ar-bronze/assets/ding.obj').then(function (r) { return r.text(); }).then(function (t) {
      cb(null, parseOBJ(t));
    }).catch(function (e) { cb(e); });
  }

  function buildDingMesh(cb) {
    fetchModel(function (err, data) {
      if (err) { cb(err, null); return; }
      var g = buildGeometry(data);
      bronzeMaterial(function (mat) {
        var mesh = new THREE.Mesh(g, mat);
        mesh.castShadow = true;
        cb(null, mesh);
      });
    });
  }

  // ---------- A-Frame 组件：在标识卡上挂载真实鼎模型 ----------
  if (window.AFRAME) {
    AFRAME.registerComponent('ding-model', {
      init: function () {
        var self = this;
        buildDingMesh(function (err, mesh) {
          if (err) { setStatus('模型加载失败，请刷新重试'); return; }
          self.el.setObject3D('ding', mesh);
          loadingEl.style.display = 'none';
          setStatus('摄像头已启动，请对准 Hiro 标识卡');
        });
      }
    });
  }

  // ---------- 3D 预览兜底（使用同一真实模型） ----------
  var fbShown = false;
  function showFallback(reason) {
    if (fbShown) return;
    fbShown = true;
    loadingEl.style.display = 'none';
    var fb = document.getElementById('fallback');
    fb.classList.add('show');
    if (reason) {
      document.getElementById('fbMsg').textContent = reason + ' · 已切换 3D 预览（鼠标 / 手指拖拽旋转）';
    }
    startPreview();
  }

  function startPreview() {
    var c = document.getElementById('view3d');
    var r = new THREE.WebGLRenderer({ canvas: c, antialias: true });
    function rs() { r.setSize(c.clientWidth, c.clientHeight); }
    rs();
    var s = new THREE.Scene();
    s.background = new THREE.Color(0x2a1f12);
    var cam = new THREE.PerspectiveCamera(45, c.clientWidth / c.clientHeight, 0.1, 20);
    cam.position.set(1.7, 1.3, 1.9);
    cam.lookAt(0, 0.4, 0);
    s.add(new THREE.HemisphereLight(0xfff7e8, 0x3a2a1a, 0.9));
    var dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(2, 4, 2);
    s.add(dir);
    var root = new THREE.Group();
    s.add(root);
    var loaded = false;
    buildDingMesh(function (err, mesh) {
      if (err) {
        document.getElementById('fbMsg').textContent = '模型加载失败，请检查网络后刷新';
        return;
      }
      mesh.scale.setScalar(0.9);
      root.add(mesh);
      loaded = true;
    });
    var dragging = false, lx = 0, ly = 0;
    c.addEventListener('mousedown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener('mouseup', function () { dragging = false; });
    c.addEventListener('touchstart', function (e) { dragging = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', function () { dragging = false; });
    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      root.rotation.y += (e.clientX - lx) * 0.01;
      root.rotation.x = Math.max(-1.2, Math.min(1.2, root.rotation.x + (e.clientY - ly) * 0.01));
      lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      root.rotation.y += (e.touches[0].clientX - lx) * 0.01;
      root.rotation.x = Math.max(-1.2, Math.min(1.2, root.rotation.x + (e.touches[0].clientY - ly) * 0.01));
      lx = e.touches[0].clientX; ly = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('resize', rs);
    (function anim() {
      requestAnimationFrame(anim);
      if (!dragging && loaded) root.rotation.y += 0.005;
      r.render(s, cam);
    })();
  }

  // ---------- 启动逻辑：等待 arjs system 就绪（最长 15s），慢/失败均不误判 ----------
  window.addEventListener('load', function () {
    var mk = document.getElementById('mymarker');
    if (mk) {
      mk.addEventListener('markerFound', function () { setStatus('✅ 已识别 Hiro 标识，青铜鼎现身！'); });
      mk.addEventListener('markerLost', function () { setStatus('请对准 Hiro 标识卡'); });
    }

    var waited = 0;
    var t = setInterval(function () {
      // arjs 在 AR.js 3.4.5 中是 system（AFRAME.systems.arjs），不是 component
      var arjs = window.AFRAME && AFRAME.systems && AFRAME.systems.arjs;
      if (arjs) {
        clearInterval(t);
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showFallback('当前环境不支持摄像头（请通过 localhost 或 https 访问）');
          return;
        }
        setStatus('摄像头已就绪，请对准 Hiro 标识卡');
        return;
      }
      waited += 500;
      if (window.__aframeLoadFailed || (waited >= 3000 && !window.AFRAME)) {
        clearInterval(t);
        showFallback('A-Frame 核心加载失败（网络不佳），请刷新重试');
        return;
      }
      if (window.__arjsLoadFailed) {
        clearInterval(t);
        showFallback('AR 引擎加载失败（网络不佳），请刷新重试');
        return;
      }
      if (waited >= 15000) {
        clearInterval(t);
        showFallback('AR 引擎加载超时，已切换 3D 预览');
      }
    }, 500);
  });

  // Hiro 标识使用官方 ARToolKit 图案（data/markers/hiro_border_p0.png）
})();
</script>

<a-scene id="arscene" embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; cameraParametersUrl: ../data/data/camera_para.dat;">
  <a-marker id="mymarker" type="pattern" url="../data/data/patt.hiro">
    <a-entity id="ding" ding-model scale="0.55 0.55 0.55"></a-entity>
    <a-text value="齐器之美 · 青铜礼器 · 春秋战国" position="0 1.3 0" color="#e8c97a" align="center" width="2.4"></a-text>
  </a-marker>
  <a-entity light="type: hemisphere; color: #fff7e8; groundColor: #3a2a1a; intensity: 1.1"></a-entity>
  <a-entity light="type: directional; color: #fff; intensity: 0.8" position="2 4 3"></a-entity>
  <a-entity camera></a-entity>
</a-scene>

</body>
</html>
