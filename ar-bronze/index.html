<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<!-- 摄像头 + 手势画布场景，禁用页面缩放以避免与双指缩放冲突（无障碍例外项） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>青铜鼎 · 悬浮 AR · 齐迹智行</title>
<script src="https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.min.js" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='../libs/three.min.js'}else{window.__threeLoadFailed=1}"></script>
<style>
:root{
  --bg:#0b0906;
  --surface:rgba(20,16,11,.9);
  --line:rgba(205,143,63,.22);
  --line-dim:rgba(205,143,63,.12);
  --t1:#ede3cc; --t2:#c9b995; --t3:#a08e6d;
  --gold:#cd8f3f; --gold-hi:#e8c97a全集族
  --ok:#8fb573; --err:#d97e5f;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t2);overflow:hidden;-webkit-tap-highlight-color:transparent}

/* ===== 摄像头背景 ===== */
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transform:scaleX(-1)}
/* 前景 3D 画布（透明背景叠在摄像头上） */
#stage{position:fixed;inset:0;z-index:1;width:100%;height:100%}

/* ===== 顶部状态胶囊 ===== */
.status{position:fixed;top:calc(.8rem + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line-dim);border-radius:20px;padding:.45rem .9rem;font-size:.72rem;color:var(--t1);z-index:100;display:flex;align-items:center;gap:.4rem;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;animation:pulse 1.2s ease-in-out infinite}
.status .dot.ok{background:var(--ok);animation:none}
.status .dot.err{background:var(--err);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 返回 ===== */
.back{position:fixed;top:calc(.8rem + env(safe-area-inset-top,0px));left:.8rem;display:inline-flex;align-items:center;gap:.3rem;color:var(--t2);text-decoration:none;font-size:.7rem;background:var(--surface);border:1px solid var(--line-dim);padding:.5rem .85rem;border-radius:20px;z-index:100;backdrop-filter:blur(4px);min-height:36px}
.back svg{width:13px;height:13px}
.back:active{color:var(--gold-hi);border-color:var(--line)}

/* ===== 悬浮 AR 操作提示 ===== */
.gesture{position:fixed;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line-dim);border-radius:20px;padding:.5rem 1rem;font-size:.72rem;color:var(--t2);z-index:100;display:flex;align-items:center;gap:.45rem;backdrop-filter:blur(4px);transition:opacity .5s ease}
.gesture svg{width:15px;height:15px;color:var(--gold)}
.gesture.hide{opacity:0;pointer-events:none}
.gesture .sub{font-size:.62rem;color:var(--t3);display:block}

/* ===== 启动引导页 ===== */
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 120% 70% at 50% 18%,rgba(205,143,63,.07) 0%,transparent 60%),var(--bg);z-index:400;padding:1.2rem;overflow:auto}
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:340px;background:linear-gradient(170deg,rgba(26,21,14,.92),rgba(14,11,8,.96));border:1px solid var(--line-dim);border-radius:16px;padding:1.8rem 1.4rem 1.4rem;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.gate-card .emblem{width:50px;height:50px;margin:0 auto .8rem;color:var(--gold);display:block;filter:drop-shadow(0 0 24px rgba(205,143,63,.28))}
.gate-card h1{font-size:1.3rem;font-weight:800;color:var(--t1);letter-spacing:5px}
.gate-card .gate-sub{font-size:.74rem;color:var(--t3);margin-top:.5rem;letter-spacing:1px;line-height:1.6}
.gate-card .no-print{display:inline-flex;align-items:center;gap:.35rem;margin-top:.6rem;font-size:.66rem;color:var(--gold-hi);border:1px solid rgba(212,160,76,.4);background:rgba(212,160,76,.08);padding:.25rem .7rem;border-radius:99px;letter-spacing:1px}
.gate-card .no-print svg{width:13px;height:13px}
.gate-actions{display:flex;flex-direction:column;gap:.6rem;margin-top:1.3rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.45rem;width:100%;padding:.82rem 1rem;border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:2px;min-height:48px;transition:transform .2s ease,border-color .25s ease,background .25s ease}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,rgba(205,143,63,.18),rgba(140,90,35,.08));color:var(--gold-hi);border:1px solid var(--line)}
.btn.primary:active{background:linear-gradient(135deg,rgba(205,143,63,.26),rgba(140,90,35,.12))}
.btn.text{background:transparent;border:none;color:var(--t3);font-size:.76rem;letter-spacing:1px;min-height:40px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(160,142,109,.3)}
.btn.ghost{background:transparent;color:var(--t2);border:1px solid rgba(160,142,109,.25)}
.gate-foot{font-size:.62rem;color:var(--t3);margin-top:1rem;letter-spacing:.5px;line-height:1.6}
.gate-card .fail-icon{width:40px;height:40px;margin:0 auto;color:var(--err)}
.gate-card h2{font-size:1.1rem;font-weight:800;color:var(--t1);letter-spacing:3px;margin:.6rem 0 .5rem}
.gate-card .fail-reason{font-size:.78rem;color:var(--t2);line-height:1.7}
.spin-ring{width:30px;height:30px;border:2.5px solid rgba(205,143,63,.18);border-top-color:var(--gold);border-radius:50%;animation:rot 1s linear infinite;margin:0 auto .8rem}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== 标记 AR 进阶页（可选） ===== */
.marker-page{display:none;position:fixed;inset:0;background:linear-gradient(165deg,#f0e6d3,#e8dcc8);color:#4a3a26;padding:2rem 1.2rem;z-index:500;overflow:auto}
.marker-page.show{display:block}
.marker-page .inner{max-width:420px;margin:0 auto;text-align:center}
.marker-page h2{color:#6b4423;margin-bottom:.4rem;font-size:1rem;letter-spacing:2px}
.marker-page .sub{font-size:.72rem;color:#8a7454;margin-bottom:.8rem}
.marker-page img{display:block;margin:0 auto;max-width:70vw;border:2px solid rgba(74,58,38,.25);border-radius:4px}
.marker-page .tip{color:#6a5940;font-size:.76rem;text-align:center;margin-top:1rem;line-height:1.9}
.marker-page .close{position:fixed;top:calc(1rem + env(safe-area-inset-top,0px));right:1rem;background:rgba(11,9,6,.9);color:#ede3cc;border:1px solid rgba(205,143,63,.25);padding:.55rem 1rem;border-radius:10px;cursor:pointer;font-size:.8rem;min-height:44px}

/* ===== 模式控制 ===== */
body.mode-gate .status,body.mode-gate .back,body.mode-gate .gesture,body.mode-gate #cam,body.mode-gate #stage{display:none}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  .status .dot{animation:none}
}
</style>
</head>
<body class="mode-gate">

<video id="cam" autoplay playsinline muted></video>
<canvas id="stage"></canvas>

<div class="status"><span class="dot" id="statusDot"></span><span id="status" role="status" aria-live="polite">等待启动…</span></div>
<a class="back" href="../">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  返回主页
</a>
<div class="gesture" id="gesture">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-6.5v-2a1.5 1.5 0 0 1 3 0V12m0-7a1.5 1.5 0 0 1 3 0v8.5m0-1.5a1.5 1.5 0 0 1 3 0v4.5a5 5 0 0 1-5 5h-1.5a4.5 4.5 0 0 1-3.18-1.32l-4.5-4.5a1.5 1.5 0 0 1 2.12-2.12l2.06 2.06"/></svg>
  <span><b>拖拽旋转</b> · 双指缩放<span class="sub">模型悬浮于眼前 · 无需打印</span></span>
</div>

<!-- 启动引导 -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div id="gateHome">
      <svg class="emblem" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 12c0-2.8 2.2-5 5-5M36 12c0-2.8-2.2-5-5-5"/><path d="M8 12h32"/>
        <path d="M10.5 12c.8 7.5 2.6 12.5 5 16h17c2.4-3.5 4.2-8.5 5-16"/>
        <path d="M16 28c.4 4.5-.6 8.5-2 11.5M24 28v11.5M32 28c-.4 4.5.6 8.5 2 11.5"/>
      </svg>
      <h1>青铜鼎 · 悬浮 AR</h1>
      <p class="gate-sub">两千五百年前的齐国青铜鼎，即刻悬浮于你眼前</p>
      <span class="no-print">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        无需打印 · 打开即见
      </span>
      <div class="gate-actions">
        <button class="btn primary" id="btnStart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8a1 1 0 0 1 .83-.45h3.74a1 1 0 0 1 .83.45L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-8Z"/><circle cx="12" cy="12.3" r="3.1"/></svg>
          开启悬浮 AR
        </button>
        <button class="btn text" id="btnMarker">想把它摆在桌面地上？看进阶玩法</button>
      </div>
      <p class="gate-foot">需允许摄像头权限 · 兼容 iOS 与安卓主流机型</p>
    </div>
    <div id="gateFail" hidden>
      <svg class="fail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>
      <h2>无法启动 AR</h2>
      <p class="fail-reason" id="failReason"></p>
      <div class="gate-actions">
        <button class="btn primary" id="btnRetry">重试</button>
        <button class="btn text" id="btnNoCam">不启用摄像头，仅 3D 预览</button>
      </div>
    </div>
  </div>
</div>

<!-- 标记 AR 进阶说明 -->
<div id="mp" class="marker-page">
  <button class="close" id="btnCloseMarker">关闭</button>
  <div class="inner">
    <h2>进阶玩法 · 摆在桌面/地面</h2>
    <p class="sub">悬浮 AR 已能直接观看。若想把它「摆」在桌面上，可配合 Hiro 标识卡</p>
    <img src="../data/markers/hiro_border_p0.png" alt="Hiro 标识图案" width="300">

      打印方式：下载下方标识图，A4 纸打印，标识宽度约 8-10 厘米<br>

    </div>
    <div class="gate-actions" style="max-width:300px;margin:0 auto">
      <a class="btn ghost" href="../data/markers/hiro_border_p0.png" download="Hiro标识.png" style="text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
        下载标识图
      </a>
      <button class="btn text" id="btnCloseMarker2">返回悬浮 AR</button>
    </div>
  </div>
</div>

<script>
(function () {
  var THREE = window.THREE;
  var CDN = 'https://cdn.jsdelivr.net/npm/@qiancheng219/qijizhixing-assets@1.0.1/ar-bronze/assets/';

  var body = document.body;
  var gate = document.getElementById('gate');
  var gateHome = document.getElementById('gateHome');
  var gateFail = document.getElementById('gateFail');
  var failReason = document.getElementById('failReason');
  var statusEl = document.getElementById('status');
  var statusDot = document.getElementById('statusDot');
  var gestureEl = document.getElementById('gesture');
  var cam = document.getElementById('cam');
  var stageCanvas = document.getElementById('stage');
  var fbMode = false;

  function setMode(m) { body.className = 'mode-' + m; }
  function setStatus(t, kind) {
    statusEl.textContent = t;
    statusDot.className = 'dot' + (kind ? ' ' + kind : '');
  }
  function showGateFail(reason) {
    failReason.textContent = reason;
    gateHome.hidden = true;
    gateFail.hidden = false;
    gate.hidden = false;
    setMode('gate');
  }

  // ---------- OBJ 解析 ----------
  function parseOBJ(text) {
    var pos = [], uv = [], faces = [];
    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i].trim();
      if (!l) continue;
      var c = l[0];
      if (c === 'v') {
        var p = l.split(/\s+/);
        if (p[0] === 'v') pos.push(+p[1], +p[2], +p[3]);
        else if (p[0] === 'vt') uv.push(+p[1], +p[2]);
      } else if (c === 'f') {
        var parts = l.split(/\s+/), ids = [];
        for (var j = 1; j < parts.length; j++) ids.push(parseInt(parts[j].split('/')[0], 10) - 1);
        for (var j2 = 1; j2 < ids.length - 1; j2++) faces.push(ids[0], ids[j2], ids[j2 + 1]);
      }
    }
    return { pos: pos, uv: uv, faces: faces };
  }
  function buildGeometry(data) {
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(data.pos), 3));
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(data.uv), 2));
    if (data.faces.length < 65536) g.setIndex(new THREE.BufferAttribute(new Uint16Array(data.faces), 1));
    else g.setIndex(new THREE.BufferAttribute(new Uint32Array(data.faces), 1));
    g.computeVertexNormals();
    return g;
  }

  // ---------- 资源加载回退（CDN → 本地 gz → 本地 obj；单源 12s 超时） ----------
  var MODEL_TIMEOUT = 12000;
  function decompressGzip(buf) { return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
  function fetchTO(url) {
    if (!window.AbortController) return fetch(url);
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, MODEL_TIMEOUT);
    return fetch(url, { signal: ctrl.signal }).finally(function () { clearTimeout(timer); });
  }
  function loadModelData() {
    var attempts = [];
    if (window.DecompressionStream) {
      attempts.push(function () { return fetchTO(CDN + 'ding.obj.gz').then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer().then(decompressGzip); }); });
      attempts.push(function () { return fetchTO('assets/ding.obj.gz').then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer().then(decompressGzip); }); });
    }
    attempts.push(function () { return fetchTO('assets/ding.obj').then(function (r) { if (!r.ok) throw 0; return r.text(); }); });
    var i = 0;
    function tryNext() { return attempts[i++]().catch(function (e) { if (i < attempts.length) return tryNext(); throw e; }); }
    return tryNext();
  }
  function bronzeMaterial() {
    var mat = new THREE.MeshStandardMaterial({ color: 0x8a6a42, metalness: 0.35, roughness: 0.5 });
    new THREE.TextureLoader().load(CDN + 'ding_diffuse.jpg', function (t) { mat.map = t; mat.needsUpdate = true; }, undefined, function () {
      new THREE.TextureLoader().load('assets/ding_diffuse.jpg', function (t) { mat.map = t; mat.needsUpdate = true; }, undefined, function () { mat.color.set(0x6b4423); mat.metalness = 0.6; mat.roughness = 0.4; });
    });
    return mat;
  }
  // 构建模型：最大边归一化到 targetSize，底部贴合 y=0，居中
  function buildMesh(targetSize, cb) {
    loadModelData().then(function (text) {
      var g = buildGeometry(parseOBJ(text));
      g.computeBoundingBox();
      var bb = g.boundingBox;
      var size = new THREE.Vector3(); bb.getSize(size);
      var s = targetSize / Math.max(size.x, size.y, size.z);
      var mesh = new THREE.Mesh(g, bronzeMaterial());
      mesh.scale.setScalar(s);
      mesh.position.set(
        -(bb.min.x + bb.max.x) / 2 * s,
        -bb.min.y * s,
        -(bb.min.z + bb.max.z) / 2 * s
      );
      cb(null, mesh);
    }).catch(function (e) { cb(e); });
  }

  // ---------- 悬浮 AR 渲染 ----------
  var renderer, scene, camera, root, discGlow;
  var loaded = false;
  var dragging = false, lastX = 0, lastY = 0;
  var pinchDist = 0, zoom = 1;
  var baseScale = 0; // 保留（未使用），后续相机距离控制

  function initGL() {
    if (renderer) return;
    renderer = new THREE.WebGLRenderer({ canvas: stageCanvas, antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0); // 透明背景，露出摄像头
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    scene.add(new THREE.HemisphereLight(0xfff7e8, 0x3a2a1a, 1.1));
    var dir = new THREE.DirectionalLight(0xffffff, 1.2); dir.position.set(2, 4, 3); scene.add(dir);
    var rim = new THREE.DirectionalLight(0xb8d0e8, 0.4); rim.position.set(-3, 2, -2); scene.add(rim);

    root = new THREE.Group(); scene.add(root);

    // 底部光环（强化悬浮立体感）
    var ringGeo = new THREE.RingGeometry(0.72, 0.80, 48);
    var ringMat = new THREE.MeshBasicMaterial({ color: 0xcd8f3f, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
    discGlow = new THREE.Mesh(ringGeo, ringMat);
    discGlow.rotation.x = -Math.PI / 2;
    discGlow.position.y = -0.02;
    root.add(discGlow);

    resize();
    window.addEventListener('resize', resize);

    var start = performance.now();
    setStatus('正在唤醒青铜鼎…', 'load');
    buildMesh(1.0, function (err, mesh) {
      if (err) { setStatus('模型加载失败，请检查网络', 'err'); return; }
      root.add(mesh);
      loaded = true;
      setStatus('青铜鼎已悬浮 · 拖拽旋转', 'ok');
      gestureEl.classList.remove('hide');
      setTimeout(function () { gestureEl.classList.add('hide'); }, 5000);
    });

    // 拖拽旋转
    stageCanvas.addEventListener('mousedown', function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mouseup', function () { dragging = false; });
    stageCanvas.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) { pinchDist = dist2(e.touches); dragging = false; }
      else if (e.touches.length === 1) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
    }, { passive: true });
    window.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinchDist = 0; if (e.touches.length < 1) dragging = false; });
    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      root.rotation.y += (e.clientX - lastX) * 0.008;
      root.rotation.x = clamp(root.rotation.x + (e.clientY - lastY) * 0.005, -0.6, 0.9);
      lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (e.touches.length === 2) {
        var d = dist2(e.touches);
        if (pinchDist > 0) {
          zoom = clamp(zoom * (pinchDist / d), 0.5, 3);
          applyCamera();
        }
        pinchDist = d;
      } else if (e.touches.length === 1 && dragging) {
        root.rotation.y += (e.touches[0].clientX - lastX) * 0.008;
        root.rotation.x = clamp(root.rotation.x + (e.touches[0].clientY - lastY) * 0.005, -0.6, 0.9);
        lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      }
    }, { passive: false });

    (function anim() {
      requestAnimationFrame(anim);
      if (!dragging && loaded) { root.rotation.y += 0.0025; discGlow.rotation.z += 0.002; }
      renderer.render(scene, camera);
    })();
  }
  function dist2(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function applyCamera() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    // 模型高度约占屏高 55%（乘用户缩放 zoom）：模型最大边归一化为 1.0
    var halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
    var targetH = h * 0.55 / zoom;
    var dist = (1.0 / (2 * Math.tan(halfFov))) * targetH;
    camera.position.set(0, 0.05, dist);
    camera.lookAt(0, 0.08, 0); // 模型中心稍偏上，留出顶部提示空间
  }
  function resize() { applyCamera(); }

  // ---------- 摄像头 ----------
  var stream = null;
  function startCam(onOk, onFail) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { onFail('当前环境不支持摄像头'); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
      .then(function (s) {
        stream = s; cam.srcObject = s;
        cam.play().then(onOk).catch(function () { onOk(); });
      })
      .catch(function (err) { onFail(err && err.message ? err.message : '摄像头授权失败'); });
  }

  function startSuspension() {
    gate.hidden = true;
    setMode('ar');
    setStatus('正在启动摄像头…', 'load');
    startCam(function () {
      initGL();
    }, function (reason) {
      // 摄像头失败：切纯 3D 预览兜底
      showGateFail(reason + '。可关闭摄像头，用 3D 预览查看。');
      initGL();
    });
  }
  function stopAll() {
    if (stream) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} stream = null; }
  }

  // ---------- 事件 ----------
  document.getElementById('btnStart').addEventListener('click', startSuspension);
  document.getElementById('btnRetry').addEventListener('click', function () { gateFail.hidden = true; gateHome.hidden = false; startSuspension(); });
  document.getElementById('btnNoCam').addEventListener('click', function () { gate.hidden = true; setMode('ar'); initGL(); });
  document.getElementById('btnMarker').addEventListener('click', function () { document.getElementById('mp').classList.add('show'); });
  document.getElementById('btnCloseMarker').addEventListener('click', function () { document.getElementById('mp').classList.remove('show'); });
  document.getElementById('btnCloseMarker2').addEventListener('click', function () { document.getElementById('mp').classList.remove('show'); });

  window.addEventListener('beforeunload', stopAll);
})();
</script>
</body>
</html>
