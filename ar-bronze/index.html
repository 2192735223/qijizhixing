<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<!-- 注：本页为摄像头 + 手势画布场景，禁用双指缩放页面以避免与 AR 交互冲突（无障碍例外项） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AR 青铜鼎 · 齐迹智行</title>
<script src="https://cdn.bootcdn.net/ajax/libs/aframe/1.2.0/aframe.min.js" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='../libs/aframe.min.js'}else{window.__aframeLoadFailed=1}"></script>
<script src="https://cdn.jsdelivr.net/npm/@qiancheng219/qijizhixing-assets@1.0.1/libs/aframe-ar.js" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='../libs/aframe-ar.js'}else{window.__arjsLoadFailed=1}"></script>
<style>
:root{
  --bg:#0b0906;
  --surface:rgba(20,16,11,.92);
  --line:rgba(205,143,63,.22);
  --line-dim:rgba(205,143,63,.12);
  --t1:#ede3cc;            /* 主文字 ≈13:1 */
  --t2:#c9b995;            /* 次文字 ≈10:1 */
  --t3:#a08e6d;            /* 三级文字 ≈6:1 */
  --gold:#cd8f3f;
  --gold-hi:#e8c97a;
  --ok:#8fb573;
  --err:#d97e5f;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t2);overflow:hidden;-webkit-tap-highlight-color:transparent}

/* ===== AR 场景层（由 JS 在用户授权后注入） ===== */
a-scene{position:fixed;inset:0;width:100vw;height:100vh;z-index:1}

/* ===== HUD ===== */
.hint{position:fixed;top:calc(.8rem + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--surface);padding:.45rem .9rem;border-radius:20px;font-size:.74rem;color:var(--t2);z-index:100;display:flex;align-items:center;gap:.35rem;border:1px solid var(--line-dim);max-width:64%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}
.hint svg{width:14px;height:14px;flex-shrink:0;color:var(--gold)}
.icon-btn{position:fixed;top:calc(.8rem + env(safe-area-inset-top,0px));right:.8rem;display:inline-flex;align-items:center;gap:.35rem;background:var(--surface);color:var(--t2);border:1px solid var(--line-dim);padding:.5rem .85rem;border-radius:20px;font-weight:600;cursor:pointer;z-index:110;font-size:.7rem;white-space:nowrap;backdrop-filter:blur(4px);transition:border-color .25s ease,color .25s ease;min-height:36px;font-family:inherit}
.icon-btn svg{width:14px;height:14px}
.icon-btn:active{border-color:var(--line);color:var(--gold-hi)}
.status{position:fixed;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line-dim);border-radius:20px;padding:.5rem 1rem;font-size:.74rem;color:var(--t1);z-index:100;display:flex;align-items:center;gap:.45rem;max-width:88%;backdrop-filter:blur(4px)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0}
.status .dot.load{animation:pulse 1.2s ease-in-out infinite}
.status .dot.ok{background:var(--ok)}
.status .dot.err{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.status .retry{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);color:var(--t2);border-radius:50%;width:28px;height:28px;cursor:pointer;flex-shrink:0}
.status .retry svg{width:13px;height:13px}
.back{position:fixed;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));left:.8rem;display:inline-flex;align-items:center;gap:.3rem;color:var(--t2);text-decoration:none;font-size:.7rem;background:var(--surface);border:1px solid var(--line-dim);padding:.5rem .85rem;border-radius:20px;z-index:100;transition:color .25s ease,border-color .25s ease;backdrop-filter:blur(4px);min-height:36px}
.back svg{width:13px;height:13px}
.back:active{color:var(--gold-hi);border-color:var(--line)}

/* ===== 启动引导页（授权前不启动摄像头） ===== */
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 120% 70% at 50% 20%,rgba(205,143,63,.07) 0%,transparent 60%),var(--bg);z-index:400;padding:1.2rem;overflow:auto}
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:340px;background:linear-gradient(170deg,rgba(26,21,14,.9),rgba(14,11,8,.95));border:1px solid var(--line-dim);border-radius:16px;padding:1.8rem 1.4rem 1.4rem;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.gate-card .emblem{width:52px;height:52px;margin:0 auto .8rem;color:var(--gold);display:block;filter:drop-shadow(0 0 24px rgba(205,143,63,.25))}
.gate-card h1{font-size:1.25rem;font-weight:800;color:var(--t1);letter-spacing:5px}
.gate-card .gate-sub{font-size:.72rem;color:var(--t3);margin-top:.4rem;letter-spacing:2px}
.steps{list-style:none;text-align:left;margin:1.2rem 0;display:flex;flex-direction:column;gap:.55rem}
.steps li{display:flex;align-items:flex-start;gap:.6rem;font-size:.78rem;color:var(--t2);line-height:1.55}
.steps li i{font-style:normal;flex-shrink:0;width:20px;height:20px;border:1px solid var(--line);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.62rem;color:var(--gold);margin-top:.1rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.45rem;width:100%;padding:.8rem 1rem;border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:2px;min-height:48px;transition:transform .2s ease,border-color .25s ease,background .25s ease}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,rgba(205,143,63,.18),rgba(140,90,35,.08));color:var(--gold-hi);border:1px solid var(--line)}
.btn.primary:active{background:linear-gradient(135deg,rgba(205,143,63,.26),rgba(140,90,35,.12));border-color:rgba(205,143,63,.4)}
.btn.ghost{background:transparent;color:var(--t2);border:1px solid rgba(160,142,109,.25)}
.btn.text{background:transparent;border:none;color:var(--t3);font-size:.76rem;letter-spacing:1px;min-height:40px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(160,142,109,.3)}
.gate-foot{font-size:.64rem;color:var(--t3);margin-top:.9rem;letter-spacing:.5px;line-height:1.6}
.gate-actions{display:flex;flex-direction:column;gap:.6rem;margin-top:1.2rem}
.gate-card h2{font-size:1.1rem;font-weight:800;color:var(--t1);letter-spacing:3px;margin:.6rem 0 .5rem}
.gate-card .fail-icon{width:40px;height:40px;margin:0 auto;color:var(--err)}
.gate-card .fail-reason{font-size:.78rem;color:var(--t2);line-height:1.7;margin-top:.2rem}
.spin-ring{width:30px;height:30px;border:2.5px solid rgba(205,143,63,.18);border-top-color:var(--gold);border-radius:50%;animation:rot 1s linear infinite;margin:0 auto .8rem}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== Hiro 标识页 ===== */
.marker-page{display:none;position:fixed;inset:0;background:linear-gradient(165deg,#f0e6d3,#e8dcc8);color:#4a3a26;padding:2rem 1.2rem;z-index:500;overflow:auto}
.marker-page.show{display:block}
.marker-page .inner{max-width:420px;margin:0 auto;text-align:center}
.marker-page h2{color:#6b4423;margin-bottom:.4rem;font-size:1rem;letter-spacing:2px}
.marker-page .sub{font-size:.72rem;color:#8a7454;margin-bottom:.8rem}
.marker-page img{display:block;margin:0 auto;max-width:78vw;border:2px solid rgba(74,58,38,.25);border-radius:4px}
.marker-page .tip{color:#6a5940;font-size:.76rem;text-align:center;margin-top:1rem;line-height:1.9}
.marker-page .dl{display:inline-flex;align-items:center;gap:.4rem;margin-top:.9rem;background:#6b4423;color:#f0e6d3;text-decoration:none;padding:.65rem 1.3rem;border-radius:10px;font-size:.8rem;font-weight:600;min-height:44px}
.marker-page .close{position:fixed;top:calc(1rem + env(safe-area-inset-top,0px));right:1rem;background:rgba(11,9,6,.9);color:#ede3cc;border:1px solid rgba(205,143,63,.25);padding:.55rem 1rem;border-radius:10px;cursor:pointer;font-size:.8rem;min-height:44px}
.marker-page .close:active{background:rgba(26,21,14,.95)}

/* ===== 3D 预览兜底（z 低于 HUD，保证打印/返回按钮在 3D 模式下可用） ===== */
.fallback{position:fixed;inset:0;display:none;background:radial-gradient(ellipse 90% 60% at 50% 35%,rgba(205,143,63,.05) 0%,transparent 60%),var(--bg);z-index:90}
.fallback.show{display:flex;flex-direction:column;align-items:center;justify-content:center}
.fallback canvas{width:92vw;height:62vh;border-radius:12px;display:block;border:1px solid var(--line-dim)}
.fallback p{margin-top:1rem;color:var(--t3);font-size:.78rem;text-align:center;padding:0 1.2rem;letter-spacing:1px}

/* 模式切换：gate 模式隐藏 HUD */
body.mode-gate .hint,body.mode-gate .status,body.mode-gate .back,body.mode-gate .icon-btn{display:none}
body.mode-3d .hint,body.mode-3d .status{display:none}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  .spin-ring{animation:rot 2.4s linear infinite!important}
  .status .dot.load{animation:pulse 2.4s ease-in-out infinite!important}
}
</style>
</head>
<body class="mode-gate">

<!-- AR 场景挂载点（授权后注入 a-scene） -->
<div id="stage"></div>

<!-- HUD -->
<div class="hint" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8a1 1 0 0 1 .83-.45h3.74a1 1 0 0 1 .83.45L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-8Z"/><circle cx="12" cy="12.3" r="3.1"/></svg>
  对准 Hiro 标识卡
</div>
<button class="icon-btn" id="btnPrint" aria-label="查看并打印 Hiro 标识">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V3.5h10V8"/><rect x="4" y="8" width="16" height="8" rx="1.5"/><path d="M7 13.5h10V20H7z"/><circle cx="17.2" cy="10.8" r=".4" fill="currentColor"/></svg>
  打印标识
</button>
<div class="status">
  <span class="dot load" id="statusDot"></span>
  <span id="status" role="status" aria-live="polite">等待启动…</span>
  <button class="retry" id="btnRetryModel" hidden aria-label="重新加载模型">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
  </button>
</div>
<a class="back" href="../">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  返回主页
</a>

<!-- 启动引导 -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div id="gateHome">
      <svg class="emblem" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 12c0-2.8 2.2-5 5-5M36 12c0-2.8-2.2-5-5-5"/>
        <path d="M8 12h32"/>
        <path d="M10.5 12c.8 7.5 2.6 12.5 5 16h17c2.4-3.5 4.2-8.5 5-16"/>
        <path d="M16 28c.4 4.5-.6 8.5-2 11.5M24 28v11.5M32 28c-.4 4.5.6 8.5 2 11.5"/>
      </svg>
      <h1>AR 青铜鼎</h1>
      <p class="gate-sub">数字焕活 · 齐器之美</p>
      <ol class="steps">
        <li><i>1</i>准备 Hiro 标识卡（可在下一步打印）</li>
        <li><i>2</i>允许浏览器使用摄像头</li>
        <li><i>3</i>将摄像头对准标识，青铜鼎即刻现身</li>
      </ol>
      <div class="gate-actions">
        <button class="btn primary" id="btnStart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8a1 1 0 0 1 .83-.45h3.74a1 1 0 0 1 .83.45L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-8Z"/><circle cx="12" cy="12.3" r="3.1"/></svg>
          开启 AR 体验
        </button>
        <button class="btn ghost" id="btnMarker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V3.5h10V8"/><rect x="4" y="8" width="16" height="8" rx="1.5"/><path d="M7 13.5h10V20H7z"/></svg>
          查看 / 打印 Hiro 标识
        </button>
        <button class="btn text" id="btnPreview3d">暂无标识卡？先看 3D 预览</button>

      <div class="gate-actions">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
          重试
        </button>
        <button class="btn ghost" id="btnPreview3d2">进入 3D 预览</button>
        <button class="btn text" id="btnMarker2">查看 / 打印 Hiro 标识</button>
      </div>
    </div>
  </div>
</div>

<!-- 3D 预览兜底 -->
<div id="fallback" class="fallback">
  <canvas id="view3d"></canvas>
  <p id="fbMsg">3D 预览模式 · 手指拖拽旋转</p>
</div>

<!-- Hiro 标识页 -->
<div id="mp" class="marker-page">
  <button class="close" id="btnCloseMarker">关闭</button>
  <div class="inner">
    <h2>Hiro 标识</h2>
    <p class="sub">打印后平放桌面，摄像头对准即可体验 AR</p>
    <img src="../data/markers/hiro_border_p0.png" alt="Hiro 标识图案" width="340">
    <div class="tip">
      打印：建议 A4 纸，标识宽度约 8—10 厘米，边界清晰不反光<br>
      摆放：平放在桌面，摄像头从上方约 30 cm 对准，保持光线充足<br>
      提示：首次使用需在浏览器弹窗中允许摄像头权限
    </div>
    <a class="dl" href="../data/markers/hiro_border_p0.png" download="Hiro标识.png">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
      下载标识图片
    </a>
  </div>
</div>

<script>
(function () {
  var THREE = (window.AFRAME && AFRAME.THREE) || window.THREE;
  var CDN = 'https://cdn.jsdelivr.net/npm/@qiancheng219/qijizhixing-assets@1.0.1/ar-bronze/assets/';

  var body = document.body;
  var gate = document.getElementById('gate');
  var gateHome = document.getElementById('gateHome');
  var gateFail = document.getElementById('gateFail');
  var failReason = document.getElementById('failReason');
  var statusEl = document.getElementById('status');
  var statusDot = document.getElementById('statusDot');
  var btnRetryModel = document.getElementById('btnRetryModel');
  var fb = document.getElementById('fallback');
  var fbMsg = document.getElementById('fbMsg');
  var stage = document.getElementById('stage');

  function setMode(m) { body.className = 'mode-' + m; }
  function setStatus(t, kind) {
    statusEl.textContent = t;
    statusDot.className = 'dot' + (kind ? ' ' + kind : '');
  }
  function showGateFail(reason) {
    failReason.textContent = reason;
    gateHome.hidden = true;
    gateFail.hidden = false;
    gate.hidden = false;
    setMode('gate');
  }

  // ---------- OBJ 解析（v / vt / f） ----------
  function parseOBJ(text) {
    var pos = [], uv = [], faces = [];
    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i].trim();
      if (!l) continue;
      var c = l[0];
      if (c === 'v') {
        var p = l.split(/\s+/);
        if (p[0] === 'v') pos.push(+p[1], +p[2], +p[3]);
        else if (p[0] === 'vt') uv.push(+p[1], +p[2]);
      } else if (c === 'f') {
        var parts = l.split(/\s+/), ids = [];
        for (var j = 1; j < parts.length; j++) {
          ids.push(parseInt(parts[j].split('/')[0], 10) - 1);
        }
        for (var j2 = 1; j2 < ids.length - 1; j2++) {
          faces.push(ids[0], ids[j2], ids[j2 + 1]);
        }
      }
    }
    return { pos: pos, uv: uv, faces: faces };
  }

  function buildGeometry(data) {
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(data.pos), 3));
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(data.uv), 2));
    if (data.faces.length < 65536) {
      g.setIndex(new THREE.BufferAttribute(new Uint16Array(data.faces), 1));
    } else {
      g.setIndex(new THREE.BufferAttribute(new Uint32Array(data.faces), 1));
    }
    g.computeVertexNormals();
    return g;
  }

  // ---------- 资源加载（CDN → 本地 gzip → 本地明文，逐级回退；单源 12s 超时） ----------
  var MODEL_TIMEOUT = 12000;
  function decompressGzip(buf) {
    return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function fetchTO(url) {
    if (!window.AbortController) return fetch(url);
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, MODEL_TIMEOUT);
    return fetch(url, { signal: ctrl.signal }).finally(function () { clearTimeout(timer); });
  }
  function loadModelData() {
    var attempts = [];
    if (window.DecompressionStream) {
      attempts.push(function () {
        return fetchTO(CDN + 'ding.obj.gz').then(function (r) {
          if (!r.ok) throw new Error('cdn');
          return r.arrayBuffer().then(decompressGzip);
        });
      });
      attempts.push(function () {
        return fetchTO('assets/ding.obj.gz').then(function (r) {
          if (!r.ok) throw new Error('local');
          return r.arrayBuffer().then(decompressGzip);
        });
      });
    }
    attempts.push(function () {
      return fetchTO('assets/ding.obj').then(function (r) {
        if (!r.ok) throw new Error('plain');
        return r.text();
      });
    });
    var i = 0;
    function tryNext() {
      return attempts[i++]().catch(function (e) {
        if (i < attempts.length) return tryNext();
        throw e;
      });
    }
    return tryNext();
  }

  // 青铜材质：贴图加载失败自动降级为纯色
  function bronzeMaterial() {
    var mat = new THREE.MeshStandardMaterial({ color: 0x8a6a42, metalness: 0.35, roughness: 0.5 });
    new THREE.TextureLoader().load(CDN + 'ding_diffuse.jpg', function (t) {
      mat.map = t; mat.needsUpdate = true;
    }, undefined, function () {
      new THREE.TextureLoader().load('assets/ding_diffuse.jpg', function (t) {
        mat.map = t; mat.needsUpdate = true;
      }, undefined, function () {
        mat.color.set(0x6b4423); mat.metalness = 0.6; mat.roughness = 0.4;
      });
    });
    return mat;
  }

  // ---------- 构建鼎模型：按包围盒自适应缩放，底部贴合标识平面 ----------
  function buildMesh(targetSize, cb) {
    loadModelData().then(function (text) {
      var g = buildGeometry(parseOBJ(text));
      g.computeBoundingBox();
      var bb = g.boundingBox;
      var size = new THREE.Vector3(); bb.getSize(size);
      var s = targetSize / Math.max(size.x, size.y, size.z);
      var mesh = new THREE.Mesh(g, bronzeMaterial());
      mesh.scale.setScalar(s);
      mesh.position.set(
        -(bb.min.x + bb.max.x) / 2 * s,
        -bb.min.y * s,
        -(bb.min.z + bb.max.z) / 2 * s
      );
      cb(null, mesh);
    }).catch(function (e) { cb(e); });
  }

  // ---------- A-Frame 组件：在标识卡上挂载鼎模型 ----------
  var modelReady = false;
  if (window.AFRAME) {
    AFRAME.registerComponent('ding-model', {
      init: function () {
        var el = this.el;
        setStatus('正在加载青铜鼎模型…', 'load');
        buildMesh(0.85, function (err, mesh) {
          if (err) {
            setStatus('模型加载失败', 'err');
            btnRetryModel.hidden = false;
            return;
          }
          el.setObject3D('mesh', mesh);
          modelReady = true;
          btnRetryModel.hidden = true;
          setStatus(camLive ? '对准 Hiro 标识卡，青铜鼎现身' : '模型就绪，正在启动摄像头…', 'ok');
        });
      }
    });
  }

  btnRetryModel.addEventListener('click', function () {
    var el = document.getElementById('ding');
    if (!el) return;
    setStatus('正在重新加载模型…', 'load');
    buildMesh(0.85, function (err, mesh) {
      if (err) { setStatus('模型加载失败', 'err'); return; }
      el.setObject3D('mesh', mesh);
      btnRetryModel.hidden = true;
      setStatus('模型就绪 · 对准 Hiro 标识卡', 'ok');
    });
  });

  // ---------- AR 场景 ----------
  var SCENE_HTML =
    '<a-scene id="arscene" embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; cameraParametersUrl: ../data/data/camera_para.dat;">' +
      '<a-marker id="mymarker" type="pattern" url="../data/data/patt.hiro">' +
        '<a-entity id="ding" ding-model></a-entity>' +
        '<a-text value="齐器之美 · 青铜礼器" position="0 1.15 0" color="#e8c97a" align="center" width="1.7"></a-text>' +
      '</a-marker>' +
      '<a-entity light="type: hemisphere; color: #fff7e8; groundColor: #3a2a1a; intensity: 1.1"></a-entity>' +
      '<a-entity light="type: directional; color: #fff; intensity: 0.8" position="2 4 3"></a-entity>' +
      '<a-entity camera></a-entity>' +
    '</a-scene>';

  var camLive = false;
  var videoTimer = null;

  function stopCamera() {
    document.querySelectorAll('video').forEach(function (v) {
      if (v.srcObject) {
        try { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      }
    });
  }
  function teardownAR() {
    if (videoTimer) { clearInterval(videoTimer); videoTimer = null; }
    var scene = document.getElementById('arscene');
    if (scene) {
      try { scene.pause(); } catch (e) {}
      scene.parentNode.removeChild(scene);
    }
    stopCamera();
    camLive = false;
  }

  function startAR() {
    if (window.__aframeLoadFailed || !window.AFRAME) {
      showGateFail('A-Frame 核心加载失败（网络不佳）。可先进入 3D 预览，或刷新重试。');
      return;
    }
    if (window.__arjsLoadFailed) {
      showGateFail('AR 引擎加载失败（网络不佳）。可先进入 3D 预览，或刷新重试。');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showGateFail('当前环境不支持摄像头：请通过 HTTPS 或 localhost 访问。可先进入 3D 预览。');
      return;
    }
    gate.hidden = true;
    setMode('ar');
    setStatus('正在启动摄像头…', 'load');
    stage.insertAdjacentHTML('beforeend', SCENE_HTML);

    var mk = document.getElementById('mymarker');
    mk.addEventListener('markerFound', function () { setStatus('已识别标识 · 青铜鼎现身', 'ok'); });
    mk.addEventListener('markerLost', function () { setStatus('请对准 Hiro 标识卡', camLive ? 'load' : 'ok'); });

    var scene = document.getElementById('arscene');
    var started = Date.now();
    videoTimer = setInterval(function () {
      var v = document.querySelector('video');
      if (v && v.readyState >= 2 && v.videoWidth > 0) {
        clearInterval(videoTimer); videoTimer = null;
        camLive = true;
        setStatus(modelReady ? '对准 Hiro 标识卡' : '摄像头已就绪，正在加载模型…', 'load');
        return;
      }
      if (Date.now() - started > 12000) {
        clearInterval(videoTimer); videoTimer = null;
        teardownAR();
        showGateFail('摄像头启动超时：请检查是否已在浏览器中允许摄像头权限，或稍后重试。');
      }
    }, 300);
  }

  // ---------- 3D 预览兜底 ----------
  var previewStarted = false;
  function startPreview() {
    if (previewStarted) return;
    previewStarted = true;
    var c = document.getElementById('view3d');
    var r = new THREE.WebGLRenderer({ canvas: c, antialias: true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    function rs() { r.setSize(c.clientWidth, c.clientHeight, false); }
    rs();
    var s = new THREE.Scene();
    s.background = new THREE.Color(0x171310);
    var cam = new THREE.PerspectiveCamera(45, 1, 0.1, 20);
    cam.position.set(1.7, 1.3, 1.9);
    cam.lookAt(0, 0.75, 0);
    s.add(new THREE.HemisphereLight(0xfff7e8, 0x3a2a1a, 0.9));
    var dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(2, 4, 2);
    s.add(dir);
    // 展台圆盘，增强落地感
    var disc = new THREE.Mesh(
      new THREE.CircleGeometry(1.15, 48),
      new THREE.MeshStandardMaterial({ color: 0x241c13, roughness: 0.95 })
    );
    disc.rotation.x = -Math.PI / 2;
    s.add(disc);
    var root = new THREE.Group();
    s.add(root);
    var loaded = false;
    setStatus('正在加载青铜鼎模型…', 'load');
    buildMesh(1.5, function (err, mesh) {
      if (err) {
        fbMsg.textContent = '模型加载失败，请检查网络后刷新';
        setStatus('模型加载失败', 'err');
        return;
      }
      root.add(mesh);
      loaded = true;
      setStatus('3D 预览 · 拖拽旋转', 'ok');
    });
    var dragging = false, lx = 0, ly = 0;
    c.addEventListener('mousedown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener('mouseup', function () { dragging = false; });
    c.addEventListener('touchstart', function (e) { dragging = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', function () { dragging = false; });
    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      root.rotation.y += (e.clientX - lx) * 0.01;
      root.rotation.x = Math.max(-1.2, Math.min(1.2, root.rotation.x + (e.clientY - ly) * 0.01));
      lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      root.rotation.y += (e.touches[0].clientX - lx) * 0.01;
      root.rotation.x = Math.max(-1.2, Math.min(1.2, root.rotation.x + (e.touches[0].clientY - ly) * 0.01));
      lx = e.touches[0].clientX; ly = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('resize', function () {
      rs();
      cam.aspect = c.clientWidth / c.clientHeight;
      cam.updateProjectionMatrix();
    });
    cam.aspect = c.clientWidth / c.clientHeight;
    cam.updateProjectionMatrix();
    (function anim() {
      requestAnimationFrame(anim);
      if (!dragging && loaded) root.rotation.y += 0.005;
      r.render(s, cam);
    })();
  }

  function start3D() {
    teardownAR();
    gate.hidden = true;
    fb.classList.add('show');
    setMode('3d');
    startPreview();
  }

  // ---------- 事件绑定 ----------
  document.getElementById('btnStart').addEventListener('click', startAR);
  document.getElementById('btnRetryAR').addEventListener('click', function () {
    gateFail.hidden = true;
    gateHome.hidden = false;
    startAR();
  });
  document.getElementById('btnPreview3d').addEventListener('click', start3D);
  document.getElementById('btnPreview3d2').addEventListener('click', start3D);
  document.getElementById('btnMarker').addEventListener('click', openMarker);
  document.getElementById('btnMarker2').addEventListener('click', openMarker);
  document.getElementById('btnPrint').addEventListener('click', openMarker);
  document.getElementById('btnCloseMarker').addEventListener('click', closeMarker);
  function openMarker() { document.getElementById('mp').classList.add('show'); }
  function closeMarker() { document.getElementById('mp').classList.remove('show'); }
})();
</script>

</body>
</html>
