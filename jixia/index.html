<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>稷下学宫 · 百家争鸣</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#080604;color:#d4c5a9;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 140% 50% at 50% -10%,rgba(139,115,85,.1) 0%,transparent 60%),radial-gradient(ellipse 80% 60% at 20% 80%,rgba(74,139,122,.05) 0%,transparent 50%);pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 1rem 1rem;min-height:100dvh;display:flex;flex-direction:column}

/* ===== Header ===== */
.hero{text-align:center;padding:calc(2rem + env(safe-area-inset-top,0px)) .5rem 1rem;flex-shrink:0}
.hero .emblem{font-size:2.6rem;display:block;margin-bottom:.2rem;filter:drop-shadow(0 0 30px rgba(205,127,50,.15));animation:floatEmblem 4s ease-in-out infinite}
@keyframes floatEmblem{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hero h1{font-size:1.5rem;font-weight:800;color:#d4c5a9;letter-spacing:8px;text-shadow:0 0 30px rgba(205,127,50,.1)}
.hero .sub{font-size:.6rem;color:#a08e6d;margin-top:.4rem;letter-spacing:2px;border:1px solid rgba(160,142,109,.25);display:inline-block;padding:.1rem .7rem;border-radius:10px}

/* ===== Progress ===== */
.progress-wrap{display:flex;align-items:center;gap:.6rem;padding:.5rem 0 .8rem;flex-shrink:0}
.progress-bar{flex:1;height:4px;background:rgba(74,58,40,.15);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#6a5a40,#cd7f32);transition:width .4s ease;border-radius:2px;width:0%}
.progress-text{font-size:.7rem;color:#a08e6d;font-weight:600;min-width:2.5rem;text-align:right;letter-spacing:1px}

/* ===== Quiz card (full-height, centered) ===== */
.quiz-area{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:1rem}
.card{background:linear-gradient(165deg,rgba(20,16,12,.85),rgba(12,10,8,.92));border:1px solid rgba(74,58,40,.15);border-radius:16px;padding:1.8rem 1.2rem;animation:fadeIn .35s ease;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(205,127,50,.2),transparent);border-radius:16px 16px 0 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.q-title{font-size:.95rem;color:#c4a970;margin-bottom:1.2rem;line-height:1.7;letter-spacing:.5px}
.q-title .num{display:inline-block;background:rgba(205,127,50,.1);color:#cd7f32;font-weight:700;font-size:.75rem;padding:.1rem .5rem;border-radius:6px;margin-right:.5rem;vertical-align:middle}
.options{display:flex;flex-direction:column;gap:.6rem}
.opt{background:rgba(12,10,8,.6);border:1px solid rgba(74,58,40,.15);border-radius:12px;padding:.9rem 1rem;cursor:pointer;transition:all .25s ease;font-size:.9rem;color:#d4c5a9;text-align:left;font-family:inherit;width:100%;min-height:50px;letter-spacing:.5px}
.opt:active:not(:disabled){border-color:rgba(205,127,50,.25);background:rgba(20,16,12,.8);transform:translateX(4px)}
.opt:disabled{cursor:default}
.opt.correct{background:linear-gradient(165deg,rgba(60,80,30,.4),rgba(40,55,20,.3));border-color:rgba(138,170,26,.35);color:#c4d4a0}
.opt.wrong{background:linear-gradient(165deg,rgba(80,30,30,.4),rgba(55,20,20,.3));border-color:rgba(170,58,26,.35);color:#d4a0a0}
.opt.show-correct{border-color:rgba(138,170,26,.25)}
.feedback{margin-top:1rem;padding:.8rem 1rem;border-radius:10px;font-size:.82rem;line-height:1.7;animation:fadeIn .3s ease;letter-spacing:.3px}
.feedback.right{background:rgba(60,80,30,.1);border:1px solid rgba(138,170,26,.15);color:#b8c898}
.feedback.wrong{background:rgba(80,30,30,.1);border:1px solid rgba(170,58,26,.15);color:#c8a0a0}
.next-btn{display:block;width:100%;margin-top:1rem;padding:.85rem;background:linear-gradient(135deg,rgba(205,127,50,.12),rgba(120,70,25,.06));color:#d4c5a9;border:1px solid rgba(205,127,50,.2);border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:3px;min-height:50px;transition:all .3s ease}
.next-btn:active{transform:scale(.97);border-color:rgba(205,127,50,.35)}

/* ===== Result ===== */
.result-area{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:1rem}
.result{text-align:center;padding:1rem .5rem;animation:fadeIn .5s ease}
.result h2{font-size:1.3rem;color:#cd7f32;margin-bottom:.8rem;letter-spacing:4px}
.result .score{font-size:1rem;color:#6a5a40;margin-bottom:1rem}
.result .score .num{color:#cd7f32;font-size:2rem;font-weight:700}
.result .stamp-wrap{display:inline-block;margin:1rem auto;padding:1.5rem 2rem;border:2px solid rgba(205,127,50,.2);border-radius:50%;transform:rotate(-5deg);background:radial-gradient(circle,rgba(205,127,50,.06) 0%,transparent 70%);box-shadow:0 0 50px rgba(205,127,50,.08)}
.result .stamp-text{font-size:1rem;color:#b8966a;font-weight:700;letter-spacing:3px;line-height:1.5}
.result .stamp-text small{display:block;font-size:.6rem;color:#8a7a60;margin-top:.4rem;font-weight:400;letter-spacing:2px}
.review{margin-top:1.5rem;text-align:left;background:linear-gradient(165deg,rgba(20,16,12,.8),rgba(12,10,8,.9));border:1px solid rgba(74,58,40,.1);border-radius:14px;padding:1rem}
.review h3{color:#6a5a40;font-size:.8rem;margin-bottom:.8rem;letter-spacing:2px}
.review-item{font-size:.75rem;padding:.5rem 0;border-bottom:1px dashed rgba(74,58,40,.08);color:#8a7a60;line-height:1.6}
.review-item:last-child{border:none}
.review-item .ok{color:#8aaa1a;font-weight:600}
.review-item .ng{color:#aa3a1a;font-weight:600}

/* ===== Footer & Back ===== */
footer{text-align:center;padding:1rem .5rem calc(.5rem + env(safe-area-inset-bottom,0px));font-size:.55rem;color:#8d7d60;line-height:1.6;flex-shrink:0}
.back{display:block;text-align:center;margin:.5rem auto;color:#a08e6d;text-decoration:none;font-size:.7rem;border:1px solid rgba(160,142,109,.25);padding:.3rem 1.2rem;border-radius:20px;width:fit-content;transition:all .3s ease;flex-shrink:0}
.back:active{color:#cd7f32;border-color:rgba(205,127,50,.2);background:rgba(20,16,12,.9)}
</style>
</head>
<body>
<div class="page">
<header>
  <span class="emblem">🎓</span>
  <h1>稷下学宫</h1>
  <p>百家争鸣 · 思想盛宴</p>
</header>
<div class="progress">
<div class="progress-bar">
<div class="progress-fill" id="pf"></div>
</div>
<div class="progress-text" id="pt">0/10</div>
</div>
<div id="quiz"></div>
<div id="result"></div>
<footer>
资料来源：司马迁《史记·田齐世家》、班固《汉书·艺文志》（公有领域，距今超过 2000 年）<br>
齐迹智行实践团 · 2026 暑假社会实践
</footer>
<a class="back" href="../">← 返回主页</a>
</div>
<script>
(function () {
var questions = [
  {q: "稷下学宫位于战国时期哪个国家的都城？", opts: ["秦国咸阳","齐国临淄","楚国郢都","赵国邯郸"], ans: 1, why: "稷下学宫位于齐国都城临淄（今山东淄博）的稷门附近，是世界上最早的官办高等学府之一。"},
  {q: "稷下学宫始建于哪一位齐国国君时期？", opts: ["齐桓公（田午）","齐威王","齐宣王","齐湣王"], ans: 0, why: "稷下学宫由齐桓公田午（公元前 374—前 357 年在位）创立，历经六代国君，持续约 150 年。"},
  {q: "被誉为稷下学宫“祭酒”的著名学者是谁？", opts: ["孟子","荀子","邹衍","淳于髡"], ans: 1, why: "“祭酒”是稷下学宫的主持者、学术领袖，荀子曾三度担任此职，是学宫最著名的先生之一。"},
  {q: "哪位思想家曾三次担任稷下学宫的“祭酒”？", opts: ["孟子","荀子","韩非子","庄子"], ans: 1, why: "荀子（荀况）在稷下学宫“三为祭酒”，是战国后期儒家的重要代表，也是稷下学宫的学术泰斗。"},
  {q: "以“滑稽多辩”著称、善用隐语劝谏齐威王的稷下学者是谁？", opts: ["淳于髡","田骈","慎到","环渊"], ans: 0, why: "淳于髡是稷下学宫早期最具代表性的学者，以博学、诙谐、善辩闻名，常用隐语委婉劝谏齐威王。"},
  {q: "提出“五德终始说”和“大九州说”的稷下学者是谁？", opts: ["邹衍","邹忌","孟子","荀子"], ans: 0, why: "邹衍是阴阳五行学说的集大成者，提出“五德终始说”解释王朝更替，又提出“大九州说”拓展地理视野。"},
  {q: "稷下先生的“不治而议论”指的是什么？", opts: ["不做官，专心务农","不担任具体政务，专以著书立说、议论国事为务","不读书，只空谈","不辩论，只抄书"], ans: 1, why: "稷下先生多被授予“上大夫”等爵禄，但不担任具体行政职务，专门著书立说、议论国家大事，体现了学术与政治的良性互动。"},
  {q: "下列哪部著作与稷下学者的整理编撰密切相关？", opts: ["《论语》","《管子》","《孟子》","《离骚》"], ans: 1, why: "《管子》托名春秋名相管仲，实为战国时期稷下学者整理编撰的论文集，内容涵盖政治、经济、哲学、军事等。"},
  {q: "稷下学宫在学术上最突出的特点是什么？", opts: ["只研究儒家经典","各家学派自由辩论","只研究法家思想","只研究道家思想"], ans: 1, why: "稷下学宫实行“不治而议论”的学术自由政策，儒、道、法、名、阴阳等各家各派在此自由辩论、相互交融，开创了“百家争鸣”的黄金时代。"},
  {q: "稷下学宫对后世最重要的影响是什么？", opts: ["建立了科举制度","开创了官办学术交流与争鸣的传统","确立了儒家独尊的地位","发明了活字印刷"], ans: 1, why: "稷下学宫作为世界上最早的官办高等学府和学术交流中心，其“百家争鸣”的学术自由精神对中国思想文化发展产生了深远影响。"}
];
var cur = 0, score = 0, answered = [];
function render() {
  var el = document.getElementById("quiz");
  if (cur >= questions.length) { el.innerHTML = ""; showResult(); return; }
  var q = questions[cur];
  var pct = (cur / questions.length) * 100;
  document.getElementById("pf").style.width = pct + "%";
  document.getElementById("pt").textContent = (cur + 1) + "/" + questions.length;
  var h = [];
  h.push('<div class="card">');
  h.push('<div class="q-title"><span class="num">第 ' + (cur + 1) + ' 题</span>' + q.q + '</div>');
  h.push('<div class="options">');
  for (var j = 0; j < q.opts.length; j++) {
    h.push('<button class="opt" data-i="' + j + '">' + String.fromCharCode(65 + j) + '. ' + q.opts[j] + '</button>');
  }
  h.push('</div></div>');
  el.innerHTML = h.join("");
  var btns = el.querySelectorAll(".opt");
  for (var k = 0; k < btns.length; k++) {
    (function(b){ b.addEventListener("click", function(){ pick(parseInt(b.dataset.i)); }); })(btns[k]);
  }
}
function pick(i) {
  var q = questions[cur];
  var btns = document.querySelectorAll(".opt");
  for (var m = 0; m < btns.length; m++) btns[m].disabled = true;
  var ok = (i === q.ans);
  if (ok) score++;
  answered.push({q: q.q, picked: i, correct: q.ans, ok: ok, opts: q.opts, why: q.why});
  btns[i].className += ok ? " correct" : " wrong";
  if (!ok) btns[q.ans].className += " show-correct";
  var fb = document.createElement("div");
  fb.className = "feedback " + (ok ? "right" : "wrong");
  fb.innerHTML = (ok ? "答对了！" : "答错了") + "<br>" + q.why;
  var card = document.querySelector(".card");
  card.appendChild(fb);
  var nb = document.createElement("button");
  nb.className = "next-btn";
  nb.textContent = (cur === questions.length - 1) ? "查看结果" : "下一题";
  nb.onclick = function(){ cur++; render(); };
  card.appendChild(nb);
  document.getElementById("pf").style.width = ((cur + 1) / questions.length) * 100 + "%";
}
function showResult() {
  document.getElementById("pf").style.width = "100%";
  document.getElementById("pt").textContent = questions.length + "/" + questions.length;
  var r = document.getElementById("result");
  var h = [];
  h.push('<div class="result">');
  h.push('<h2>答题完成</h2>');
  h.push('<div class="score">得分：<span class="num">' + score + '</span> / ' + questions.length + '</div>');
  h.push('<div class="stamp-wrap"><div class="stamp-text">稷下学宫<br>知识小达人<small>齐迹智行实践团 · 2026</small></div></div>');
  h.push('<div class="review"><h3>答题回顾</h3>');
  for (var n = 0; n < answered.length; n++) {
    var a = answered[n];
    h.push('<div class="review-item">第 ' + (n + 1) + ' 题：' + (a.ok ? '<span class="ok">正确</span>' : '<span class="ng">错误</span>') + '（你的答案：' + a.opts[a.picked] + '，正确答案：' + a.opts[a.correct] + '）</div>');
  }
  h.push('</div></div>');
  r.innerHTML = h.join("");
}
render();
})();
</script>
</body>
</html>
