<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>齐国故城 · 千年复原</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#080604;color:#d4c5a9;overflow:hidden;height:100vh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 140% 50% at 50% -10%,rgba(139,115,85,.1) 0%,transparent 60%),radial-gradient(ellipse 80% 60% at 20% 80%,rgba(74,139,122,.05) 0%,transparent 50%);pointer-events:none;z-index:0}
.overlay-header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(.6rem + env(safe-area-inset-top,0px)) 1rem .6rem;background:linear-gradient(180deg,rgba(8,6,4,.85) 0%,transparent 100%)}
.overlay-header .brand{display:flex;align-items:center;gap:.3rem}
.overlay-header .brand .name{font-size:.7rem;color:#6a5a40;letter-spacing:3px;font-weight:600}
.overlay-header .sub{font-size:.55rem;color:#3a2a1a;letter-spacing:1px}
.wrap{flex:1;position:relative;touch-action:none;z-index:1}
canvas{display:block;width:100%;height:100%}
.info{position:fixed;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(20,16,12,.85);border:1px solid rgba(205,127,50,.08);border-radius:12px;padding:.45rem .9rem;max-width:88%;font-size:.65rem;color:#4a3a28;text-align:center;line-height:1.6;backdrop-filter:blur(4px);z-index:10}
.back{position:fixed;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));left:1rem;color:#4a3a28;text-decoration:none;font-size:.65rem;background:rgba(20,16,12,.85);border:1px solid rgba(74,58,40,.12);padding:.35rem .8rem;border-radius:20px;z-index:10;transition:all .3s ease;backdrop-filter:blur(4px)}
.back:active{color:#cd7f32;border-color:rgba(205,127,50,.15)}
footer{position:relative;z-index:1;text-align:center;padding:.2rem .4rem calc(.2rem + env(safe-area-inset-bottom,0px));font-size:.55rem;color:#2a1a10;background:#080604}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,6,4,.96);z-index:50}
#loading .spin{width:40px;height:40px;border:3px solid rgba(74,58,40,.2);border-top-color:rgba(205,127,50,.4);border-radius:50%;animation:rot 1s linear infinite}
#loading p{color:#6a5a40;font-size:.85rem;margin-top:1rem;letter-spacing:2px}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="overlay-header">
  <div class="brand">
    <span class="name">齐国故城 · 千年复原</span>
    <span class="sub">临淄 · 约前1046—前221</span>
  </div>
</div>
<div class="wrap"><canvas id="city"></canvas></div>
<div class="info">故城由大城与小城组成 · 手指拖拽旋转 · 双指缩放</div>
<a class="back" href="../">← 返回</a>
<footer>布局参考：临淄齐国故城遗址 · 材质：Poly Haven CC0</footer>
<div id="loading"><div class="spin"></div><p>正在复原齐国故城…</p></div>
<script src="../libs/three.min.js"></script>
<script>
(function () {
  var loadingEl = document.getElementById('loading');
  var canvas = document.getElementById('city');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  var scene = new THREE.Scene();
  var SKY = 0xb8a888;
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 160, 340);
  var camera = new THREE.PerspectiveCamera(50, 1, 0.5, 500);
  var manager = new THREE.LoadingManager();
  manager.onLoad = function () { loadingEl.style.opacity = '0'; setTimeout(function () { loadingEl.style.display = 'none'; }, 500); };
  setTimeout(function () { loadingEl.style.opacity = '0'; setTimeout(function () { loadingEl.style.display = 'none'; }, 500); }, 15000);
  var TEXV = '?v=5';
  function tex(src, rx, ry) {
    var t = new THREE.TextureLoader(manager).load(src + TEXV, function () {}, undefined, function () { console.error('texture fail: ' + src); });
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1); t.anisotropy = 8; return t;
  }
  function mat(map, opts) { return new THREE.MeshStandardMaterial(Object.assign({ map: map, roughness: 0.92, metalness: 0.04 }, opts || {})); }
  function matB(diff, bump, rx, ry, opts, bs) { var m = mat(tex('assets/' + diff, rx, ry), opts); var b = tex('assets/' + bump, rx, ry); m.bumpMap = b; m.bumpScale = bs || 0.04; return m; }
  var groundMat = matB('patterned_cobblestone_02_diff.jpg','patterned_cobblestone_02_bump.png',10,10,{roughness:0.9,metalness:0.02});
  var roadMat = matB('patterned_cobblestone_02_diff.jpg','patterned_cobblestone_02_bump.png',1,1,{roughness:0.8});
  var brickMat = matB('factory_brick_diff.jpg','factory_brick_bump.png',1,1,{roughness:0.85});
  var woodMat = matB('wooden_planks_diff.jpg','wooden_planks_bump.png',1,1,{roughness:0.78});
  var clayMat = matB('clay_block_wall_diff.jpg','clay_block_*,1,1,{roughness:0.82});
  var darkMat = new THREE.MeshStandardMaterial({color:0x3a2a1a,roughness:0.9,metalness:0.05});
  var roofMat = new THREE.MeshStandardMaterial({color:0x3f4a4d,roughness:0.9,metalness:0.05});
  var wallMat = matB('clay_block_wall_diff.jpg','clay_block_*,1,1,{roughness:0.85});
  var waterMat = new THREE.MeshStandardMaterial({color:0x6a8a6a,roughness:0.6,metalness:0.1});
  var sandMat = new THREE.MeshStandardMaterial({color:0x8a7a50,roughness:0.95});
  var light = new THREE.HemisphereLight(0xfff7e8,0x3a2a1a,0.8); scene.add(light);
  var sun = new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(40,60,40); scene.add(sun);
  var amb = new THREE.AmbientLight(0x8a7a60,0.15); scene.add(amb);
  function add(m){scene.add(m);return m}
  function box(w,h,d,x,y,z,m){var mm=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mm.position.set(x,y,z);return add(mm)}
  function gable(w,h,d,x,y,z,rh,m){var g=new THREE.BufferGeometry();var hw=w/2,hd=d/2;var v=new Float32Array([-hw,0,-hd,hw,0,-hd,hw,0,hd,-hw,0,hd,0,h,0]);g.setAttribute('position',new THREE.BufferAttribute(v,3));g.setIndex([0,1,4,1,2,4,2,3,4,3,0,4,0,2,1,0,3,2]);g.computeVertexNormals();var mm=new THREE.Mesh(g,m);mm.position.set(x,y,z);return add(mm)}
  add(new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({map:tex('assets/ground_dirt.jpg',30,30),roughness:0.95,metalness:0.01}))).rotation.x=-Math.PI/2;
  // City walls
  var ws = 0.32, wh = 4.2;
  function wallSeg(pts) { for (var i = 0; i < pts.length - 1; i++) { var dx = pts[i+1][0] - pts[i][0], dz = pts[i+1][1] - pts[i][1]; var len = Math.sqrt(dx*dx + dz*dz), cx = (pts[i][0] + pts[i+1][0]) / 2, cz = (pts[i][1] + pts[i+1][1]) / 2; var m = new THREE.Mesh(new THREE.BoxGeometry(len, wh, ws), wallMat); m.position.set(cx, wh/2, cz); m.rotation.y = Math.atan2(dx, dz); add(m); } }
  var OUTER = [[-53,-48],[-53,48],[53,48],[53,-48],[-53,-48]]; wallSeg(OUTER);
  var INNER = [[-40,-38],[-40,38],[40,38],[40,-38],[-40,-38]]; wallSeg(INNER);
  function build(x, y, z, w, d, h, m) { box(w, h, d, x, y + h/2, z, m); }
  function hbuild(x, y, z, w, d, h, m) { build(x, y, z, w, d, h, m); }
  // Palace complex
  for (var px = -20; px <= 20; px += 6) { for (var pz = -20; pz <= 20; pz += 6) { if (Math.random() > 0.3) { var bh = 2.2 + Math.random() * 1.5; build(px, 0, pz, 3.5, 3.5, bh, brickMat); if (Math.random() > 0.5) gable(5, 1.0, 5, px, bh, pz, roofMat); } } }
  // Roads
  box(0.6, 0.05, 86, 0, 0.03, 0, roadMat); box(86, 0.05, 0.6, 0, 0.03, 0, roadMat);
  // Labels
  function label(text, x, y, z) { var cv = document.createElement('canvas'); cv.width = 512; cv.height = 128; var ctx = cv.getContext('2d'); ctx.fillStyle = 'rgba(30,22,12,0.78)'; var r = 18; ctx.beginPath(); ctx.moveTo(r,0); ctx.lineTo(512-r,0); ctx.quadraticCurveTo(512,0,512,r); ctx.lineTo(512,128-r); ctx.quadraticCurveTo(512,128,512-r,128); ctx.lineTo(r,128); ctx.quadraticCurveTo(0,128,0,128-r); ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 4; ctx.stroke(); ctx.font = 'bold 58px \"Microsoft YaHei\",\"PingFang SC\",sans-serif'; ctx.fillStyle = '#f0e6d3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 256, 66); var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthTest: false })); sp.position.set(x, y, z); sp.scale.set(9, 2.4, 1); add(sp); }
  label('大城', 33, 7.5, -32); label('小城', -30, 8.5, -38); label('宫殿区', -30, 7.2, -20); label('市集', 0, 5, 14); label('淄河', 58.5, 5.5, 24);
  // Camera controls
  var theta = 0.72, phi = 1.02, radius = 105;
  if (window.innerWidth < window.innerHeight) { radius = 140; phi = 1.12; }
  function resize() { var w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  function updateCam() { camera.position.x = radius * Math.sin(phi) * Math.cos(theta); camera.position.z = radius * Math.sin(phi) * Math.sin(theta); camera.position.y = radius * Math.cos(phi); camera.lookAt(0, 2.5, 0); }
  updateCam();
  var drag = false, lx = 0, ly = 0, lastAct = Date.now(), pinchDist = 0;
  function onDown(x, y) { drag = true; lx = x; ly = y; lastAct = Date.now(); }
  function onUp() { drag = false; pinchDist = 0; }
  function onMove(x, y) { if (!drag) return; theta -= (x - lx) * 0.006; phi = Math.max(0.25, Math.min(Math.PI/2-0.08, phi - (y - ly) * 0.006)); lx = x; ly = y; lastAct = Date.now(); updateCam(); }
  canvas.addEventListener('mousedown', function(e) { onDown(e.clientX, e.clientY); });
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', function(e) { if (e.touches.length === 2) { pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); drag = false; } else if (e.touches.length === 1) { onDown(e.touches[0].clientX, e.touches[0].clientY); } }, { passive: true });
  window.addEventListener('touchend', function(e) { if (e.touches.length < 2) onUp(); });
  window.addEventListener('mousemove', function(e) { onMove(e.clientX, e.clientY); });
  window.addEventListener('touchmove', function(e) { if (e.touches.length === 2) { var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (pinchDist > 0) { radius = Math.max(45, Math.min(190, radius * (pinchDist / d))); updateCam(); } pinchDist = d; lastAct = Date.now(); } else if (e.touches.length === 1) { onMove(e.touches[0].clientX, e.touches[0].clientY); } }, { passive: true });
  canvas.addEventListener('wheel', function(e) { e.preventDefault(); radius = Math.max(45, Math.min(190, radius + e.deltaY * 0.06)); updateCam(); }, { passive: false });
  window.addEventListener('resize', resize); resize();
  (function anim() { requestAnimationFrame(anim); if (!drag && Date.now() - lastAct > 4000) { theta += 0.0016; updateCam(); } renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
